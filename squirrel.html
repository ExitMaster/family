<body class="notranslate">
<div id="app"></div>
<script>
// ── 하람쥐와 주니어: 매일 다람쥐 이야기 ────────────────────────────────────────
//  날짜를 씨앗으로 삼는 결정론적 생성기.
//  같은 날짜 = 언제 열어도, 누가 열어도 똑같은 이야기.
const K_STORE = 'family-squirrel-v1';

// ── 씨앗 난수 (mulberry32) ───────────────────────────────────
function hashStr(s) {
  let h = 2166136261;
  for (let i=0; i<s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick  = (r, arr) => arr[Math.floor(r() * arr.length)];
const pickN = (r, arr, n) => {
  const pool = arr.slice(), out = [];
  while (out.length < n && pool.length) out.push(pool.splice(Math.floor(r()*pool.length), 1)[0]);
  return out;
};

// ── 재료 ─────────────────────────────────────────────────────
const ELDER = 'Haramji';
const YOUNGER = 'Haramji Jr.';   // 문장 끝에 그대로 놓이므로 마침표를 이름이 갖고 있다
const PLACES = [
  {n:'Oakridge Hill',        d:'the first slope the sun touches'},
  {n:'the birch stand',      d:'where a white fog lies down every morning'},
  {n:'the stepping stones',  d:'where the creek talks all day long'},
  {n:'the abandoned mailbox',d:'that nobody has opened in years'},
  {n:'the bench in the city park', d:'where footsteps come and go like surf'},
  {n:'the pinecone slope',   d:'that turns entirely brown in autumn'},
  {n:'the old lighthouse yard', d:'where a light swings around once a minute at night'},
  {n:'the fir hollow',       d:'where footprints last a long time under snow'},
  {n:'the attic windowsill', d:'where the smell of dust is somehow comforting'},
  {n:'the fallen stone wall',d:'laid over with moss like a green blanket'}
];
const SEASONS = [
  'Early spring, before the dew had burned off',
  'Midsummer, with the cicadas at full volume',
  'Autumn, with the wind knocking acorns loose',
  'Winter, after the first snow had settled',
  'The third straight day of rain',
  'An early summer night with far too many stars'
];
// 그날 형(하람쥐)의 상태 / 동생(주니어)의 그날 엉뚱함
const ELDER_MOODS = [
  'had already recounted yesterday\u2019s acorns three times and gotten a different number each time',
  'had a stiff back and was not about to mention it',
  'was in a genuinely good mood, on account of the light',
  'had sighed once in advance, on the assumption that Jr. would start something',
  'had promised himself a nap and meant it',
  'was busy checking whether the winter store still closed properly'
];
const YOUNGER_QUIRKS = [
  'liked shiny pebbles considerably more than acorns',
  'asked "why" exactly three times about everything',
  'liked wearing his brother\u2019s tail as a scarf best of all',
  'was afraid of heights and kept looking up at the tallest branch anyway',
  'did not himself know what was in his cheek pouches',
  'kept forgetting how to stop once he started running',
  'gave a name to every insect he had not met before'
];
const WANTS = [
  'fill out a hundred acorns for the winter',
  'teach Jr. how to cross the creek',
  'get up to the highest branch in the woods together',
  'dig a new store nobody would ever find',
  'deliver a letter to the neighbours who had moved away',
  'find out what was making that noise in the middle of the night',
  'recover the shiny pebble Jr. had lost',
  'patch the roof before the first frost'
];
const TROUBLES = [
  'a magpie kept following a few lengths behind them',
  'last night\u2019s rain had taken the whole path with it',
  'half the stored acorns had gone missing overnight',
  'the fog came in thick enough to hide their own front paws',
  'a branch went over with a crack, straight down the middle',
  'a strange set of tracks ran right up to the store',
  'the sun was going down considerably faster than expected',
  'Jr. got well out in front while nobody was watching'
];
const FRIENDS = [
  {n:'an unhurried old mole',      s:'The mole',      h:'a shortcut underground'},
  {n:'a fast-talking chickadee',   s:'The chickadee', h:'what the place looked like from above'},
  {n:'a hedgehog who said nothing',s:'The hedgehog',  h:'about the berries kept in among his spines'},
  {n:'a lost kitten',              s:'The kitten',    h:'how to keep smiling at a frightening thing'},
  {n:'an owl who read',            s:'The owl',       h:'which stars to steer by after dark'},
  {n:'a shy tree frog',            s:'The frog',      h:'how to smell rain before it arrives'}
];
const TWISTS = [
  'the acorns had not been stolen at all \u2014 Jr. had hidden them separately, for later',
  'the noise was the lid of the old mailbox knocking in the wind',
  'under the washed-out path lay a set of old stone steps nobody had known about',
  'the magpie had been trying to return the pebble Jr. had dropped',
  'what you could see from the highest branch was not a view, but their own roof',
  'Jr. had known the way the whole time, and pretended otherwise so his brother would not worry',
  'the letter had arrived long ago. Only the reply never came'
];
const LESSONS = [
  'stop because a thing is frightening and you never learn how small it was',
  'fifty acorns each between two of you fills you up better than a hundred alone',
  'getting lost is one of the ways of learning a place',
  'a younger brother grows up faster than you expect',
  'you have to go the whole distance out before home means anything',
  'small feet still cover a fair amount of ground in one day',
  'waiting is also a way of doing something'
];
const ENDINGS = [
  'That night the two of them slept full, under Haramji\u2019s tail like a blanket.',
  'They reached the door before the sun was all the way down. Late, but not too late.',
  'Jr. left one acorn outside the door, for whoever came along next.',
  'By morning there was one more small trail marker in the woods, built by the two of them.',
  'Haramji never told anyone about it. He simply took that path every day afterwards.',
  '"Are we going together tomorrow?" Jr. asked. Haramji answered by knocking his tail against his brother\u2019s back.'
];
const OPENERS = ['%S%, ','Before anything else was awake, ','On a day that smelled like rain, ','In the afternoon, with everyone else asleep, '];
const HEADINGS = ['Haramji and Jr. at %P%','A Day in the Life of the Haramji Brothers','What Happened at %P%','The Day Jr. Went First','Haramji and %F%'];

const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
// 제목용: 관사·전치사만 소문자로 남기는 통상적인 영문 제목 표기.
const SMALL = new Set(['the','a','an','in','on','at','of','and','by','where']);
const titleCase = t => t.split(' ')
  .map((w, i) => (i > 0 && SMALL.has(w.toLowerCase())) ? w.toLowerCase() : cap(w))
  .join(' ');

// ── 이야기 생성 ──────────────────────────────────────────────
function dayKey(d) {
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function makeStory(key) {
  const r = rng(hashStr('haramji|'+key));
  const place  = pick(r, PLACES);
  const season = pick(r, SEASONS);
  const elderMood= pick(r, ELDER_MOODS);
  const quirk  = pick(r, YOUNGER_QUIRKS);
  const want   = pick(r, WANTS);
  const [t1,t2]= pickN(r, TROUBLES, 2);
  const friend = pick(r, FRIENDS);
  const twist  = pick(r, TWISTS);
  const lesson = pick(r, LESSONS);
  const ending = pick(r, ENDINGS);
  const opener = pick(r, OPENERS).replace('%S%', season);
  const heading = pick(r, HEADINGS)
    .replace('%P%', titleCase(place.n))
    .replace('%F%', friend.n);

  const paras = [
    `At ${place.n}, ${place.d}, live two squirrel brothers, ${ELDER} and ${YOUNGER} The younger of the two ${quirk}.`,
    `${opener}${ELDER} ${elderMood}. There was one thing to do that day: ${want}. Jr. was already at the door with his tail going.`,
    `They did not get far before there was a problem. ${cap(t1)}. They stopped to get their breath back, and then ${t2}. ${ELDER} took hold of his brother\u2019s paw.`,
    `That was when ${friend.n} turned up. "Come round this way." ${friend.s} knew ${friend.h}. The three of them walked on, and the way turned out shorter than it had looked.`,
    `And so they found out: ${twist}. Jr. laughed. ${ELDER} pretended not to, and then did.`,
    `What ${ELDER} told his brother that day was this: ${lesson}.`,
    ending
  ];
  return { key, heading, paras, season };
}

// ── 색 보조 ──────────────────────────────────────────────────
// 색을 흰색 쪽으로 섞어 주니어의 밝은 털색을 만든다.
function lightenHex(hex, amt) {
  const h = hex.replace('#','');
  const f = i => {
    const c = parseInt(h.slice(i, i+2), 16);
    return Math.round(c + (255 - c) * amt).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(2) + f(4);
}


// ── 이야기 영상 (캔버스 애니메이션) ──────────────────────────
//  문단 하나 = 장면 하나. 계절에 따라 하늘·날씨·바닥색이 바뀌고
//  하람쥐 형제가 스크롤되는 숲을 걸어간다. 전부 캔버스 실시간 렌더.
const SCENE_MS = 6200;
const SEASON_ART = {
  '봄':   {sky:['#8fb2cc','#d8e4d2'], haze:'#cdd9cf', hill:'#6d8560', ground:'#5f6b45', litter:'#7a8450', weather:'petal',   particle:'#e8dcc8'},
  '여름': {sky:['#6f9dc4','#cfe0d4'], haze:'#c2d2c6', hill:'#4a6b45', ground:'#415433', litter:'#586b38', weather:'firefly', particle:'#f2e6a8'},
  '가을': {sky:['#a9a08a','#e2d3b4'], haze:'#d8c8a8', hill:'#7d6438', ground:'#6b512f', litter:'#8a6431', weather:'leaf',    particle:'#a8652c'},
  '겨울': {sky:['#8e9db0','#dfe6ec'], haze:'#dbe3ea', hill:'#7d8794', ground:'#c9d3dc', litter:'#aab6c2', weather:'snow',    particle:'#f4f8fb'},
  '장마': {sky:['#6f7c85','#b8c3c4'], haze:'#b3bdbd', hill:'#4f5f4c', ground:'#47543a', litter:'#5b6742', weather:'rain',    particle:'#c6d6de'},
  '밤':   {sky:['#141c30','#31405c'], haze:'#2b3852', hill:'#1d2537', ground:'#232b3a', litter:'#2c3547', weather:'star',    particle:'#e8e2c4'}
};
function seasonOf(seasonLine) {
  if (/[Ww]inter|snow/.test(seasonLine)) return '겨울';
  if (/rain/.test(seasonLine)) return '장마';
  if (/night|stars/.test(seasonLine)) return '밤';
  if (/[Mm]idsummer|cicada/.test(seasonLine)) return '여름';
  if (/[Aa]utumn/.test(seasonLine)) return '가을';
  return '봄';
}

function createPlayer(canvas, story, onEnd) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const r = rng(hashStr('art|' + story.key));
  const furs = ['#8a6a4d','#6f5a44','#9a7350','#7b6350','#a1794f','#5f5044'];  // 실제 청설모/다람쥐 털색
  const fur = furs[Math.floor(r() * furs.length)];
  const kidFur = lightenHex(fur, .16);
  const season = seasonOf(story.season || '');
  const A = SEASON_ART[season];
  const total = story.paras.length * SCENE_MS;

  // 배경 요소를 미리 뿌려 둔다 (매 프레임 난수 금지 — 깜빡임 방지)
  const trees = Array.from({length: 26}, (_, i) => ({
    x: i * 120 + (i % 3) * 37, h: 90 + (i % 5) * 26, layer: i % 2, w: 16 + (i % 3) * 5
  }));
  const bits = Array.from({length: 70}, (_, i) => ({
    x: Math.random() * W, y: Math.random() * H,
    sp: 0.4 + Math.random() * 1.6, sw: Math.random() * 6.28, sz: 1.5 + Math.random() * 3
  }));

  let t0 = null, raf = null, elapsed = 0, playing = false;

  // 사실적인 다람쥐 (옆모습, 오른쪽을 봄).
  //  털 결은 짧은 선을 결 방향으로 얹어서 표현하고, 명암은 그라디언트로 준다.
  // 털: 짧고 끝이 가늘어지는 선을 결 방향(dir)으로 촘촘히 얹는다.
  //  한 겹으로는 그림처럼 보여서, 밝은 겉털 → 어두운 속털 순으로 두세 겹 쌓는다.
  function furStrands(cx, cy, rx, ry, n, color, len, seedOff, dir) {
    ctx.strokeStyle = color; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = (i * 2.399 + seedOff) % 6.283;
      const rr = 0.35 + ((i * 0.37) % 0.62);
      const px = cx + Math.cos(a) * rx * rr, py = cy + Math.sin(a) * ry * rr;
      const wob = Math.sin(i * 1.7) * 0.35;
      const ang = (dir === undefined ? a : dir + wob);
      const l = len * (0.55 + ((i * 0.19) % 0.6));
      ctx.lineWidth = 0.45 + (i % 3) * 0.22;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.quadraticCurveTo(px + Math.cos(ang) * l * 0.6, py + Math.sin(ang) * l * 0.6 - 0.6,
                           px + Math.cos(ang) * l,       py + Math.sin(ang) * l);
      ctx.stroke();
    }
  }

  function drawSquirrel(x, y, k, f, phase) {
    const dark  = shade(f, -0.34), mid = shade(f, -0.15);
    const light = lightenHex(f, 0.30), belly = lightenHex(f, 0.62);
    const bob = Math.sin(phase) * 2.2 * k;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(k, k);
    ctx.lineJoin = 'round';

    // 땅 그림자 (몸 아래로 눌린 타원)
    ctx.fillStyle = 'rgba(30,22,12,.22)';
    ctx.beginPath(); ctx.ellipse(4, 2 - bob / k, 34, 5.5, 0, 0, 6.29); ctx.fill();

    // ── 꼬리: 뒤쪽에 크게. 겉털(밝음) 위에 속털(어두움)을 겹친다.
    ctx.save();
    ctx.translate(-24, -14);
    ctx.rotate(Math.sin(phase * 0.7) * 0.10);
    const tg = ctx.createLinearGradient(-30, -40, 10, 10);
    tg.addColorStop(0, lightenHex(f, .18)); tg.addColorStop(0.5, f); tg.addColorStop(1, dark);
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(6, 6);
    ctx.bezierCurveTo(-34, 8, -46, -34, -22, -62);
    ctx.bezierCurveTo(-6, -78, 16, -70, 20, -52);
    ctx.bezierCurveTo(6, -62, -12, -54, -14, -34);
    ctx.bezierCurveTo(-16, -16, -2, -6, 8, -2);
    ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    furStrands(-12, -36, 24, 32, 110, 'rgba(255,242,222,.09)', 9, 0.6, -1.35);
    furStrands(-10, -30, 22, 30, 120, 'rgba(30,20,10,.16)',   8, 2.1, -1.15);
    furStrands(-14, -44, 20, 24,  70, 'rgba(255,244,226,.12)',11, 4.0, -1.55);
    ctx.restore();
    ctx.restore();

    // ── 뒷다리(허벅지) → 몸통 → 앞다리 순으로 겹친다.
    ctx.fillStyle = mid;
    ctx.beginPath(); ctx.ellipse(-8, -16, 17, 15, -0.15, 0, 6.29); ctx.fill();   // 허벅지
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(-4, -3, 11, 4.5, -0.12, 0, 6.29); ctx.fill();   // 뒷발

    const bg2 = ctx.createLinearGradient(0, -40, 0, -2);
    bg2.addColorStop(0, mid); bg2.addColorStop(0.62, f); bg2.addColorStop(1, belly);
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(-20, -12);
    ctx.bezierCurveTo(-22, -34, -6, -44, 10, -40);   // 등
    ctx.bezierCurveTo(22, -37, 26, -24, 24, -14);    // 가슴
    ctx.bezierCurveTo(20, -4, -8, -2, -20, -12);     // 배
    ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    furStrands(0, -26, 22, 17, 130, 'rgba(30,20,10,.14)',   6, 1.2, 0.45);
    furStrands(6, -16, 18, 11,  90, 'rgba(255,255,255,.18)', 5, 3.4, 0.55);
    furStrands(-6, -34, 18, 10,  70, 'rgba(255,255,255,.13)', 5, 5.1, 0.15);
    ctx.restore();

    ctx.fillStyle = mid;                                                          // 앞다리
    ctx.beginPath();
    ctx.moveTo(18, -22); ctx.bezierCurveTo(24, -16, 24, -8, 21, -3);
    ctx.bezierCurveTo(17, -2, 15, -8, 14, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(21, -2.5, 5, 2.6, 0, 0, 6.29); ctx.fill();       // 앞발

    // ── 머리: 주둥이가 앞으로 나온 쐐기 모양.
    const hg = ctx.createLinearGradient(10, -58, 10, -30);
    hg.addColorStop(0, mid); hg.addColorStop(1, f);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(8, -34);
    ctx.bezierCurveTo(6, -50, 18, -58, 28, -55);     // 이마
    ctx.bezierCurveTo(38, -52, 42, -45, 41, -41);    // 코끝
    ctx.bezierCurveTo(38, -36, 30, -32, 20, -32);    // 턱
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = belly;                                                        // 목·뺨 밝은 털
    ctx.beginPath(); ctx.ellipse(24, -36, 9, 4.5, -0.15, 0, 6.29); ctx.fill();

    ctx.fillStyle = f;                                                            // 귀 + 귀털
    ctx.beginPath(); ctx.ellipse(16, -55, 4.5, 7, -0.25, 0, 6.29); ctx.fill();
    ctx.fillStyle = shade(f, -0.45);
    ctx.beginPath(); ctx.ellipse(16, -54, 2.2, 4.2, -0.25, 0, 6.29); ctx.fill();
    ctx.strokeStyle = light; ctx.lineWidth = 0.9;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(15 + i * 2, -61); ctx.lineTo(14 + i * 2.6, -67); ctx.stroke();
    }

    ctx.save();                                                                   // 머리 털결
    ctx.beginPath();
    ctx.moveTo(8, -34); ctx.bezierCurveTo(6, -50, 18, -58, 28, -55);
    ctx.bezierCurveTo(38, -52, 42, -45, 41, -41);
    ctx.bezierCurveTo(38, -36, 30, -32, 20, -32); ctx.closePath(); ctx.clip();
    furStrands(22, -45, 13, 10, 70, 'rgba(30,20,10,.13)',   4, 0.9, 0.30);
    furStrands(20, -50, 11,  7, 45, 'rgba(255,255,255,.15)', 3.4, 2.6, -0.2);
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.30)';                                      // 눈 둘레 밝은 털
    ctx.beginPath(); ctx.ellipse(27, -48, 4.4, 3.9, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#14100c';                                                    // 눈
    ctx.beginPath(); ctx.ellipse(27, -48, 2.4, 2.3, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(27.8, -48.8, 0.7, 0, 6.29); ctx.fill();

    ctx.fillStyle = '#2b1d14';                                                    // 코
    ctx.beginPath(); ctx.ellipse(41, -42, 1.9, 1.5, 0.3, 0, 6.29); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.6;                // 수염
    for (let i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(39, -41 + i * 0.9);
      ctx.quadraticCurveTo(50, -44 + i * 3.2, 58, -40 + i * 5.2); ctx.stroke();
    }
    ctx.restore();
  }

  // 색을 검정 쪽으로 섞어 그늘색을 만든다 (amt<0 만 사용).
  function shade(hex, amt) {
    const h = hex.replace('#', ''), m = Math.abs(amt);
    const f = i => {
      const c = parseInt(h.slice(i, i + 2), 16);
      return Math.round(c * (1 - m)).toString(16).padStart(2, '0');
    };
    return '#' + f(0) + f(2) + f(4);
  }

  function wrap(text, maxW) {
    const words = text.split(' '), lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }

  function frame(ms) {
    const idx = Math.min(story.paras.length - 1, Math.floor(ms / SCENE_MS));
    const local = (ms % SCENE_MS) / SCENE_MS;
    const scroll = ms / 26;

    const g = ctx.createLinearGradient(0, 0, 0, H * 0.72);          // 하늘
    g.addColorStop(0, A.sky[0]); g.addColorStop(1, A.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (season === '밤') {
      ctx.fillStyle = 'rgba(240,236,214,.85)';
      ctx.beginPath(); ctx.arc(W - 78, 58, 21, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgba(240,236,214,.10)';
      ctx.beginPath(); ctx.arc(W - 78, 58, 40, 0, 6.29); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.28)';                      // 낮은 구름층
      for (let i = 0; i < 4; i++) {
        const cx = (((i * 260 - scroll * 0.12) % (W + 340)) + W + 340) % (W + 340) - 170;
        ctx.beginPath(); ctx.ellipse(cx, 46 + i * 13, 100, 15, 0, 0, 6.29); ctx.fill();
      }
    }

    // 원경: 안개에 잠긴 나무 실루엣 세 겹. 뒤로 갈수록 흐리게 (대기원근).
    for (let d = 0; d < 3; d++) {
      const depth = 1 - d * 0.3;
      ctx.globalAlpha = 0.16 + d * 0.16;
      ctx.filter = `blur(${(2 - d) * 1.8}px)`;
      ctx.fillStyle = A.hill;
      const baseY = H * (0.52 + d * 0.05);
      const sp = 0.06 + d * 0.10;
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = -40; x <= W + 40; x += 14) {
        const n = Math.sin((x + scroll * sp) / 37) + Math.sin((x + scroll * sp) / 91) * 1.6;
        ctx.lineTo(x, baseY - n * 11 * depth - (Math.abs(Math.sin((x + d * 50) / 23)) > 0.86 ? 26 * depth : 0));
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1; ctx.filter = 'none';
    }
    ctx.fillStyle = A.haze; ctx.globalAlpha = 0.14;                 // 안개 띠
    ctx.fillRect(0, H * 0.50, W, H * 0.14); ctx.globalAlpha = 1;

    // 중경/근경 나무: 줄기 명암 + 불규칙한 잎 덩어리
    for (const layer of [0, 1]) {
      const sp = layer ? 1 : 0.42;
      const span = 120 * 26;
      const leafBase = season === '겨울' ? '#8d9aa6' : (season === '가을' ? '#8a6a34' : '#3f5e39');
      for (const tr of trees) {
        if (tr.layer !== layer) continue;
        let x = ((tr.x - scroll * sp) % span + span) % span - 60;
        if (x < -110 || x > W + 110) continue;
        const base = H * (layer ? 0.74 : 0.64);
        const hh = tr.h * (layer ? 1 : 0.72);
        ctx.globalAlpha = layer ? 1 : 0.5;
        ctx.filter = layer ? 'none' : 'blur(3px)';
        const bark = ctx.createLinearGradient(x - tr.w / 2, 0, x + tr.w / 2, 0);
        bark.addColorStop(0, '#3d2f22'); bark.addColorStop(0.45, '#5c4632'); bark.addColorStop(1, '#2f2417');
        ctx.fillStyle = bark;
        ctx.beginPath();
        ctx.moveTo(x - tr.w / 2.4, base);
        ctx.lineTo(x - tr.w / 4.5, base - hh * 0.62);
        ctx.lineTo(x + tr.w / 4.5, base - hh * 0.62);
        ctx.lineTo(x + tr.w / 2.4, base); ctx.closePath(); ctx.fill();
        if (season !== '겨울' || layer === 0) {
          for (let c = 0; c < 5; c++) {                              // 잎 덩어리
            const a = c * 1.7 + tr.x;
            ctx.fillStyle = c % 2 ? leafBase : shade(leafBase, -0.22);
            ctx.beginPath();
            ctx.ellipse(x + Math.cos(a) * tr.w * 1.5, base - hh * (0.66 + Math.abs(Math.sin(a)) * 0.28),
                        tr.w * 1.5, tr.w * 1.15, a, 0, 6.29);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1; ctx.filter = 'none';
      }
    }

    // 바닥: 흙 그라디언트 + 낙엽/풀 잔결
    const gg = ctx.createLinearGradient(0, H * 0.70, 0, H);
    gg.addColorStop(0, A.ground); gg.addColorStop(1, shade(A.ground, -0.30));
    ctx.fillStyle = gg; ctx.fillRect(0, H * 0.70, W, H * 0.30);
    ctx.strokeStyle = A.litter; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.55;
    for (let i = 0; i < 90; i++) {
      const gx = ((i * 71 - scroll) % (W + 60) + W + 60) % (W + 60) - 30;
      const gy = H * 0.71 + ((i * 37) % Math.round(H * 0.28));
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + ((i % 5) - 2) * 2, gy - 4 - (i % 4)); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const walk = ms / 150;                                    // 형제 둘
    ctx.save();
    ctx.shadowColor = 'rgba(20,14,8,.45)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    drawSquirrel(W * 0.28, H * 0.715, 1.30, fur, walk);
    drawSquirrel(W * 0.55, H * 0.695, 0.82, kidFur, walk + 1.6);
    ctx.restore();

    for (const b of bits) {                                   // 날씨 입자
      ctx.fillStyle = A.particle;
      if (A.weather === 'rain') {
        const y = (b.y + ms * b.sp * 0.55) % H;
        ctx.globalAlpha = .55; ctx.fillRect(b.x, y, 1.6, 12); ctx.globalAlpha = 1;
      } else if (A.weather === 'star' || A.weather === 'firefly') {
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(ms / 500 + b.sw));
        ctx.globalAlpha = tw;
        const y = A.weather === 'star' ? b.y * 0.6 : b.y * 0.9;
        ctx.beginPath(); ctx.arc(b.x, y, b.sz * 0.7, 0, 6.29); ctx.fill();
        ctx.globalAlpha = 1;
      } else {
        const y = (b.y + ms * b.sp * 0.06) % H;
        const x = b.x + Math.sin(ms / 700 + b.sw) * 18;
        ctx.globalAlpha = .85;
        ctx.beginPath(); ctx.ellipse(x, y, b.sz, b.sz * (A.weather === 'snow' ? 1 : 0.6), b.sw, 0, 6.29); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // 렌즈 느낌: 앞쪽 흐린 잎 몇 장이 화면 가장자리를 스친다 (전경 아웃포커스)
    ctx.save();
    ctx.filter = 'blur(9px)';
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = season === '겨울' ? '#8ea0b2' : (season === '가을' ? '#5f4420' : '#24391f');
    for (let i = 0; i < 3; i++) {
      const fx = ((i * 430 - scroll * 2.8) % (W + 760) + W + 760) % (W + 760) - 380;
      const fy = i % 2 ? H * 0.03 : H * 0.94;          // 위아래 가장자리만 스치게
      ctx.beginPath();
      ctx.ellipse(fx, fy, 96, 40, i * 0.7, 0, 6.29);
      ctx.fill();
    }
    ctx.restore();

    // 필름 그레인 — 매끈한 벡터 느낌을 덜어 준다
    ctx.globalAlpha = 0.045;
    for (let i = 0; i < 900; i++) {
      const gx = (i * 6997 + Math.floor(ms / 90) * 131) % W;
      const gy = (i * 3571 + Math.floor(ms / 90) * 977) % H;
      ctx.fillStyle = (i % 2) ? '#fff' : '#000';
      ctx.fillRect(gx, gy, 1, 1);
    }
    ctx.globalAlpha = 1;

    const grade = ctx.createLinearGradient(0, 0, W, H);        // 색 보정
    grade.addColorStop(0, season === '밤' ? 'rgba(40,60,120,.14)' : 'rgba(255,186,112,.06)');
    grade.addColorStop(1, 'rgba(18,26,34,.09)');
    ctx.fillStyle = grade; ctx.fillRect(0, 0, W, H);

    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.32)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    const fade = Math.min(1, local * 6) * Math.min(1, (1 - local) * 8);   // 자막
    const text = story.paras[idx];
    ctx.font = '500 17px "Inter", system-ui, sans-serif';
    const lines = wrap(text, W - 80);
    const boxH = lines.length * 26 + 26;
    ctx.globalAlpha = fade;
    ctx.fillStyle = 'rgba(8,8,10,.55)';
    ctx.beginPath();
    const bx = 26, by = H - boxH - 26, bw = W - 52, rad = 14;
    ctx.moveTo(bx + rad, by); ctx.arcTo(bx + bw, by, bx + bw, by + boxH, rad);
    ctx.arcTo(bx + bw, by + boxH, bx, by + boxH, rad);
    ctx.arcTo(bx, by + boxH, bx, by, rad); ctx.arcTo(bx, by, bx + bw, by, rad);
    ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'top';
    lines.forEach((ln, i) => ctx.fillText(ln, bx + 18, by + 14 + i * 26));
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, H - 5, W, 5);   // 진행바
    ctx.fillStyle = '#ffb454'; ctx.fillRect(0, H - 5, W * (ms / total), 5);
  }

  function loop(now) {
    if (!playing) return;
    if (t0 === null) t0 = now - elapsed;
    elapsed = now - t0;
    if (elapsed >= total) { frame(total - 1); stop(); onEnd && onEnd(); return; }
    frame(elapsed);
    raf = requestAnimationFrame(loop);
  }
  function play()  { if (playing) return; playing = true; t0 = null; raf = requestAnimationFrame(loop); }
  function stop()  { playing = false; if (raf) cancelAnimationFrame(raf); raf = null; }
  function reset() { stop(); elapsed = 0; frame(0); }

  frame(0);
  return {
    play, stop, reset, get playing() { return playing; }, totalMs: total,
    toggle() { playing ? stop() : play(); }
  };
}

// ── 상태 ─────────────────────────────────────────────────────
function loadRead() {
  try { return JSON.parse(localStorage.getItem(K_STORE) || '[]'); } catch(e) { return []; }
}
function markRead(key) {
  const s = loadRead();
  if (!s.includes(key)) { s.push(key); try { localStorage.setItem(K_STORE, JSON.stringify(s.slice(-400))); } catch(e) {} }
}
let offset = 0;   // 0 = 오늘, 1 = 어제 …

function currentKey() {
  const d = new Date();
  d.setDate(d.getDate() - offset);
  return dayKey(d);
}
function label(key) {
  if (offset === 0) return 'today';
  if (offset === 1) return 'yesterday';
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [, m, dd] = key.split('-');
  return `${MON[Number(m) - 1]} ${Number(dd)}`;
}

// ── 렌더 ─────────────────────────────────────────────────────
function render() {
  const key = currentKey();
  const s = makeStory(key);
  markRead(key);
  const readCount = loadRead().length;

  document.getElementById('app').innerHTML = `
  <div style="max-width:620px; margin:0 auto; padding:22px 18px 56px;">
    <div style="text-align:center; margin-bottom:6px;">
      <div style="font-family:'Noto Serif',Georgia,serif; font-size:26px; font-weight:700; letter-spacing:-.02em; color:#2f2a24;">Haramji &amp; Haramji Jr.</div>
      <div style="font-size:12px; color:#8b8377; margin-top:4px; letter-spacing:.08em;">${key} · the story for ${label(key)}</div>
    </div>

    <div style="position:relative; margin:12px 0 4px; border-radius:18px; overflow:hidden;
                border:1px solid #ded7cb; box-shadow:0 2px 10px rgba(60,50,35,.10); background:#000;">
      <canvas id="vid" width="640" height="360" style="display:block; width:100%; height:auto;"></canvas>
      <button id="playbig" class="tapbtn" aria-label="play"
        style="position:absolute; inset:0; margin:auto; width:74px; height:74px; border:none; border-radius:50%;
               background:rgba(250,248,244,.92); color:#3b352d; font-size:26px; cursor:pointer;">▶</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
      <button id="play" class="tapbtn" style="flex:1; padding:11px; font-size:15px; font-weight:700; font-family:inherit;
        border:none; border-radius:12px; background:#4a4238; color:#f4f1ea; cursor:pointer;">▶ Play</button>
      <button id="replay" class="tapbtn" style="padding:11px 16px; font-size:15px; font-weight:700; font-family:inherit;
        border:none; border-radius:12px; background:#e4ded3; color:#3b352d; cursor:pointer;">↺</button>
      <button id="save" class="tapbtn" style="padding:11px 16px; font-size:15px; font-weight:700; font-family:inherit;
        border:none; border-radius:12px; background:#e4ded3; color:#3b352d; cursor:pointer;">⬇ Save</button>
    </div>

    <div style="background:#faf8f4; border:1px solid #ded7cb; border-radius:6px; padding:26px 22px;
                box-shadow:0 2px 10px rgba(60,50,35,.07); animation:fadeUp .35s ease both;">
      <div style="font-family:'Noto Serif',Georgia,serif; font-size:22px; font-weight:700; color:#2f2a24; text-align:center; margin-bottom:18px; line-height:1.45;">
        ${s.heading}
      </div>
      ${s.paras.map(p => `<p style="font-family:'Noto Serif',Georgia,serif; font-size:16px; line-height:2.0; margin:0 0 16px; color:#3b352d;">${p}</p>`).join('')}
      <div style="text-align:center; font-size:12px; color:#a49b8d; margin-top:10px; letter-spacing:.3em;">END</div>
    </div>

    <div style="display:flex; gap:10px; margin-top:16px;">
      <button id="prev" class="tapbtn" style="flex:1; padding:14px; font-size:16px; font-weight:700; font-family:inherit;
        border:none; border-radius:14px; background:#e4ded3; color:#3b352d; cursor:pointer;">← Earlier</button>
      <button id="next" class="tapbtn" ${offset===0?'disabled':''} style="flex:1; padding:14px; font-size:16px; font-weight:700; font-family:inherit;
        border:none; border-radius:14px; cursor:${offset===0?'default':'pointer'};
        background:${offset===0?'#eae5dc':'#e4ded3'}; color:${offset===0?'#b6afa3':'#3b352d'};">Next →</button>
    </div>
    <button id="copy" class="tapbtn" style="width:100%; margin-top:10px; padding:14px; font-size:16px; font-weight:700; font-family:inherit;
      border:none; border-radius:14px; background:#4a4238; color:#f4f1ea; cursor:pointer;">📋 Copy story</button>

    <div style="text-align:center; font-size:13px; color:#a4907a; margin-top:18px;">
      ${readCount} ${readCount === 1 ? 'story' : 'stories'} read · a new one arrives at midnight
    </div>
  </div>`;

  // ── 영상 플레이어 ──
  const canvas = document.getElementById('vid');
  const playBig = document.getElementById('playbig');
  const playBtn = document.getElementById('play');
  const syncBtn = () => {
    playBtn.textContent = player.playing ? '⏸ Pause' : '▶ Play';
    playBig.style.display = player.playing ? 'none' : 'block';
  };
  const player = createPlayer(canvas, s, syncBtn);
  const toggle = () => { player.toggle(); syncBtn(); };
  playBig.onclick = toggle;
  playBtn.onclick = toggle;
  document.getElementById('replay').onclick = () => { player.reset(); player.play(); syncBtn(); };

  // 저장: 캔버스를 실시간으로 녹화해 webm으로 내려받는다 (영상 길이만큼 걸림).
  document.getElementById('save').onclick = (ev) => {
    if (!canvas.captureStream || typeof MediaRecorder === 'undefined') {
      ev.target.textContent = 'unsupported'; return;
    }
    const btn = ev.target;
    btn.disabled = true;
    const chunks = [];
    const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: 'video/webm' });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      const a = document.createElement('a');
      a.href = url; a.download = `haramji-${key}.webm`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      btn.disabled = false; btn.textContent = '⬇ Save';
    };
    player.reset(); rec.start(); player.play(); syncBtn();
    btn.textContent = 'recording…';
    setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, player.totalMs + 400);
  };

  document.getElementById('prev').onclick = () => { offset++; render(); window.scrollTo(0,0); };
  document.getElementById('next').onclick = () => { if (offset > 0) { offset--; render(); window.scrollTo(0,0); } };
  document.getElementById('copy').onclick = (e) => {
    const text = `${s.heading}\n(${key})\n\n` + s.paras.join('\n\n');
    const done = () => { e.target.textContent = 'Copied ✅'; setTimeout(() => { e.target.textContent = '📋 Copy story'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(err) {}
      document.body.removeChild(ta); done();
    }
  };
}
render();
</script>
</body>
</html>
