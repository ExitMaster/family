<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="우리끼리 미리 보고 예약하는 한글마켓">
  <title>한글마켓</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#173f35;--muted:#6f7e78;--paper:#f8f7f1;--card:#fff;--line:#dedfd7;--lime:#d7ed72;--lime2:#edf6bd;--orange:#ff7b54;--shadow:0 10px 30px rgba(23,63,53,.08)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--paper)}body{margin:0;color:var(--ink);background:var(--paper);font-family:Pretendard,"Noto Sans KR",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.hidden{display:none!important}
    .shell{max-width:520px;margin:auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:100px}.top{position:sticky;top:0;z-index:10;padding:18px 20px 12px;background:rgba(248,247,241,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between}.brand{font-family:"Gowun Batang",serif;font-size:25px;letter-spacing:-1px}.brand b{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--lime);font-size:18px;margin-right:6px}.icon-btn{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px}.hero{margin:8px 16px 20px;padding:25px 22px;background:var(--ink);color:#fff;border-radius:24px;position:relative;overflow:hidden}.hero:after{content:"ㅎㄱ";position:absolute;right:-10px;bottom:-34px;font:700 100px/1 "Gowun Batang";color:rgba(255,255,255,.07)}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--lime);text-transform:uppercase}.hero h1{font:700 27px/1.35 "Gowun Batang";margin:8px 0}.hero p{font-size:14px;line-height:1.6;margin:0;color:#d8e2de}.controls{padding:0 16px 14px;display:flex;gap:8px;align-items:center}.select{min-width:0;flex:1;border:1px solid var(--line);background:white;border-radius:13px;padding:12px 36px 12px 14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat}.fav-filter{border:1px solid var(--line);background:white;padding:11px 13px;border-radius:13px;font-weight:700;white-space:nowrap}.fav-filter.on{background:#fff0ec;border-color:#ffcbbd;color:#d74f2e}.section-head{display:flex;align-items:end;justify-content:space-between;padding:6px 18px 12px}.section-head h2{font:700 21px "Gowun Batang";margin:0}.count{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 16px}.card{background:#fff;border:1px solid #e9e9e1;border-radius:19px;overflow:hidden;box-shadow:0 4px 16px rgba(23,63,53,.045);text-align:left;padding:0;position:relative}.card-img{aspect-ratio:1/1;background:#e9eee8;width:100%;object-fit:cover;display:block}.no-img{aspect-ratio:1/1;display:grid;place-items:center;background:var(--lime2);font:700 30px "Gowun Batang"}.badge{position:absolute;left:9px;top:9px;padding:6px 9px;border-radius:10px;background:rgba(23,63,53,.9);color:#fff;font-size:11px;font-weight:700}.badge.reserved{background:#f06e49}.badge.sold{background:#66706d}.heart{position:absolute;right:8px;top:8px;width:35px;height:35px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:18px;display:grid;place-items:center}.card-body{padding:13px}.seller{font-size:11px;color:var(--muted);font-weight:600}.title{margin:5px 0 8px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:16px;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}.empty .face{display:block;font-size:40px;margin-bottom:12px}.fab{position:fixed;z-index:12;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 32px),488px);height:58px;border:0;border-radius:18px;background:var(--lime);color:var(--ink);font-size:16px;font-weight:800;box-shadow:0 12px 30px rgba(23,63,53,.2)}
    .screen{position:fixed;z-index:30;inset:0;background:var(--paper);overflow:auto}.screen-inner{max-width:520px;min-height:100%;margin:auto;padding-bottom:30px}.screen-top{position:sticky;top:0;z-index:4;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(248,247,241,.94);backdrop-filter:blur(14px)}.screen-top h2{font:700 21px "Gowun Batang";margin:0}.text-btn{border:0;background:none;font-weight:700;padding:10px}.danger{color:#d94b3a}.detail-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e8ede6}.dots{display:flex;justify-content:center;gap:5px;margin:-20px 0 12px;position:relative}.dot{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.6)}.dot.on{width:20px;background:#fff}.detail-content{padding:20px}.detail-seller{display:flex;align-items:center;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--lime);font-weight:800}.detail-content h1{font:700 27px/1.35 "Gowun Batang";margin:21px 0 8px}.detail-price{font-size:23px;font-weight:800}.detail-desc{white-space:pre-wrap;line-height:1.7;color:#3f514b;margin:24px 0}.detail-actions{display:grid;grid-template-columns:52px 1fr;gap:9px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 25%);padding:28px 16px max(16px,env(safe-area-inset-bottom))}.detail-actions button{height:55px;border-radius:17px;font-weight:800}.reserve{border:0;background:var(--ink);color:#fff}.reserve.cancel{background:#fff;border:1px solid var(--ink);color:var(--ink)}.detail-heart{border:1px solid var(--line);background:white;font-size:21px}.owner-actions{display:flex;gap:8px;margin-top:16px}.owner-actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700}
    .form{padding:10px 18px}.field{margin-bottom:20px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;outline:none}.field input:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,63,53,.08)}.field textarea{min-height:140px;resize:vertical}.price-row{display:grid;grid-template-columns:1fr 110px;gap:8px}.photos{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.photo-add,.photo-preview{width:91px;height:91px;border-radius:14px;flex:0 0 91px}.photo-add{border:1px dashed #9ca9a4;background:#f1f2ed;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:700}.photo-preview{position:relative;overflow:hidden}.photo-preview img{width:100%;height:100%;object-fit:cover}.remove-photo{position:absolute;right:4px;top:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff}.submit{width:100%;border:0;background:var(--ink);color:white;border-radius:16px;padding:16px;font-weight:800}.hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
    .join{min-height:100vh;display:grid;align-content:center;max-width:520px;margin:auto;padding:32px 24px;background:var(--ink);color:white}.join-mark{width:67px;height:67px;border-radius:22px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font:700 31px "Gowun Batang";transform:rotate(-4deg)}.join h1{font:700 40px "Gowun Batang";margin:24px 0 7px}.join p{color:#cad8d3;line-height:1.65;margin:0 0 32px}.join label{font-size:13px;font-weight:700;margin:0 0 8px;display:block}.join input{width:100%;padding:15px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:rgba(255,255,255,.09);color:#fff;margin-bottom:17px;outline:none}.join input::placeholder{color:#96aaa3}.join button{border:0;background:var(--lime);padding:16px;border-radius:16px;font-weight:800;margin-top:7px}.gate-note{font-size:12px!important;color:#90a49d!important;margin-top:16px!important}.toast{position:fixed;z-index:80;left:50%;bottom:92px;transform:translate(-50%,20px);background:#173f35;color:#fff;padding:12px 17px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}.toast.show{opacity:1;transform:translate(-50%,0)}.loader{padding:60px;text-align:center;color:var(--muted)}
    @media(min-width:521px){.shell,.screen-inner{border-left:1px solid var(--line);border-right:1px solid var(--line)}.screen{background:#e9ece6}.join{min-height:calc(100vh - 48px);margin-top:24px;border-radius:28px}}
  </style>
</head>
<body>
  <section id="join" class="join hidden">
    <div class="join-mark">ㅎㄱ</div><h1>한글마켓</h1><p>우리끼리 미리 보고, 가볍게 예약해요.<br>초대받은 분만 입장할 수 있어요.</p>
    <label for="nickname">닉네임</label><input id="nickname" maxlength="12" placeholder="친구들이 알아볼 이름">
    <label for="contact">연락처</label><input id="contact" maxlength="30" placeholder="전화번호 또는 카카오톡 ID">
    <button id="joinBtn">마켓 입장하기</button><p class="gate-note">입력한 연락처는 거래를 위해 마켓 참여자에게 표시됩니다.</p>
  </section>

  <main id="app" class="shell hidden">
    <header class="top"><div class="brand"><b>ㅎㄱ</b>한글마켓</div><button class="icon-btn" id="shareMarket" aria-label="마켓 공유">↗</button></header>
    <section class="hero"><span class="eyebrow">One day flea market</span><h1>좋은 물건의<br>새 주인을 찾아요.</h1><p>마음에 드는 물건은 먼저 예약해 보세요.</p></section>
    <div class="controls"><select id="sellerFilter" class="select" aria-label="판매자별 보기"><option value="">모든 판매자</option></select><button id="favFilter" class="fav-filter">♡ 찜만 보기</button></div>
    <div class="section-head"><h2>새로 올라온 물건</h2><span id="count" class="count"></span></div>
    <section id="grid" class="grid"><div class="loader">물건을 불러오는 중...</div></section>
    <button class="fab" id="addBtn">＋ 내 물건 등록하기</button>
  </main>

  <section id="detail" class="screen hidden"><div class="screen-inner"><header class="screen-top"><button class="icon-btn back" aria-label="뒤로">←</button><h2>물건 상세</h2><button class="icon-btn" id="shareItem" aria-label="물건 공유">↗</button></header><div id="detailBody"></div></div></section>
  <section id="editor" class="screen hidden"><div class="screen-inner"><header class="screen-top"><button class="icon-btn" id="closeEditor" aria-label="닫기">×</button><h2 id="editorTitle">물건 등록</h2><span style="width:42px"></span></header>
    <form id="productForm" class="form">
      <div class="field"><label>사진 <span id="photoCount">0/5</span></label><div id="photos" class="photos"><label class="photo-add">＋<br>사진 추가<input id="photoInput" type="file" accept="image/*" multiple hidden></label></div><p class="hint">대표 사진을 먼저 선택해 주세요. 최대 5장까지 등록할 수 있어요.</p></div>
      <div class="field"><label for="productName">상품명</label><input id="productName" required maxlength="40" placeholder="어떤 물건인가요?"></div>
      <div class="field"><label for="price">판매 가격</label><div class="price-row"><input id="price" required type="number" min="0" max="100000000" inputmode="numeric" placeholder="가격"><select id="priceType" class="select"><option value="price">원</option><option value="free">무료나눔</option></select></div></div>
      <div class="field"><label for="quantity">수량</label><input id="quantity" required type="number" min="1" max="99" value="1" inputmode="numeric"><p class="hint">여러 개라면 수량만큼 각각 예약할 수 있어요.</p></div>
      <div class="field"><label for="description">설명</label><textarea id="description" required maxlength="1000" placeholder="크기, 사용감, 하자 등 구매자가 알아야 할 내용을 적어주세요."></textarea></div>
      <button class="submit" type="submit">등록 완료</button>
    </form></div></section>
  <div id="toast" class="toast"></div>

  <script type="module">
    import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import {getDatabase,ref,onValue,set,push,update,remove,runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
    const firebaseConfig={apiKey:'AIzaSyDNETb44pue8Kg9tYWqna7y6N7MlCoMpU0',authDomain:'unimai-game-hub.firebaseapp.com',databaseURL:'https://unimai-game-hub-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'unimai-game-hub',appId:'1:527407328515:web:751f851d2a00e0a2980d36'};
    const INVITE='hangul-market';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    let auth,db,user,products={},photos=[],editingId=null,currentId=null,favOnly=false;
    let profile=JSON.parse(localStorage.getItem('hangul-profile')||'null');
    let favorites=new Set(JSON.parse(localStorage.getItem('hangul-favorites')||'[]'));
    const invited=new URLSearchParams(location.search).get('invite')===INVITE||sessionStorage.getItem('hangul-invited')==='1';
    if(new URLSearchParams(location.search).get('invite')===INVITE)sessionStorage.setItem('hangul-invited','1');
    function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2300)}
    function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function price(p){return p.priceType==='free'?'무료나눔':Number(p.price||0).toLocaleString('ko-KR')+'원'}
    function status(p){const n=Object.keys(p.reservations||{}).length;if(p.sold)return['판매완료','sold'];if(n>=Number(p.quantity||1))return['예약중','reserved'];return['판매중','']}
    function saveFav(){localStorage.setItem('hangul-favorites',JSON.stringify([...favorites]));render()}
    async function boot(){
      if(!invited){document.body.innerHTML='<section class="join"><div class="join-mark">ㅎㄱ</div><h1>초대가 필요해요</h1><p>한글마켓은 지인들만 이용하는 공간이에요.<br>받으신 초대 링크로 다시 접속해 주세요.</p></section>';return}
      try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);await signInAnonymously(auth);onAuthStateChanged(auth,u=>{if(!u)return;user=u;if(profile)enter();else $('#join').classList.remove('hidden')})}catch(e){toast('연결하지 못했어요. 잠시 후 다시 시도해 주세요.');$('#join').classList.remove('hidden')}
    }
    $('#joinBtn').onclick=async()=>{const nickname=$('#nickname').value.trim(),contact=$('#contact').value.trim();if(!nickname||!contact)return toast('닉네임과 연락처를 모두 입력해 주세요.');profile={nickname,contact};localStorage.setItem('hangul-profile',JSON.stringify(profile));if(user)await set(ref(db,`hangulMarket/profiles/${user.uid}`),profile);enter()};
    function enter(){
      $('#join').classList.add('hidden');$('#app').classList.remove('hidden');
      set(ref(db,`hangulMarket/profiles/${user.uid}`),profile).catch(()=>{});
      onValue(ref(db,'hangulMarket/products'),snap=>{products=snap.val()||{};render();openFromUrl()});
    }
    function render(){
      const seller=$('#sellerFilter').value;
      const sellers=[...new Set(Object.values(products).map(p=>p.sellerName))].sort();
      const old=seller;$('#sellerFilter').innerHTML='<option value="">모든 판매자</option>'+sellers.map(s=>`<option ${s===old?'selected':''}>${esc(s)}</option>`).join('');
      let list=Object.entries(products).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
      if(seller)list=list.filter(([,p])=>p.sellerName===seller);if(favOnly)list=list.filter(([id])=>favorites.has(id));
      $('#count').textContent=`${list.length}개`;$('#grid').innerHTML=list.length?list.map(([id,p])=>{const st=status(p);return `<article class="card" data-id="${id}">${p.photos?.[0]?`<img class="card-img" src="${p.photos[0]}" alt="">`:`<div class="no-img">한글</div>`}<span class="badge ${st[1]}">${st[0]}</span><button class="heart" data-fav="${id}" aria-label="찜">${favorites.has(id)?'♥':'♡'}</button><div class="card-body"><div class="seller">${esc(p.sellerName)} · 수량 ${p.quantity||1}</div><div class="title">${esc(p.name)}</div><div class="price">${price(p)}</div></div></article>`}).join(''):'<div class="empty"><span class="face">☘</span>조건에 맞는 물건이 없어요.</div>';
      $$('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-fav]'))return;openDetail(c.dataset.id)});$$('[data-fav]').forEach(b=>b.onclick=()=>{favorites.has(b.dataset.fav)?favorites.delete(b.dataset.fav):favorites.add(b.dataset.fav);saveFav()});
    }
    $('#sellerFilter').onchange=render;$('#favFilter').onclick=()=>{favOnly=!favOnly;$('#favFilter').classList.toggle('on',favOnly);$('#favFilter').textContent=favOnly?'♥ 찜만 보기':'♡ 찜만 보기';render()};
    function openFromUrl(){const id=new URLSearchParams(location.search).get('item');if(id&&products[id]&&id!==currentId)openDetail(id,false)}
    function openDetail(id,pushHistory=true){
      const p=products[id];if(!p)return;currentId=id;const st=status(p),reservations=p.reservations||{},mine=!!reservations[user.uid],full=Object.keys(reservations).length>=Number(p.quantity||1),owner=p.owner===user.uid;
      $('#detailBody').innerHTML=`${p.photos?.length?`<img id="detailImage" class="detail-img" src="${p.photos[0]}" alt="${esc(p.name)}">${p.photos.length>1?`<div class="dots">${p.photos.map((_,i)=>`<span class="dot ${i===0?'on':''}" data-photo="${i}"></span>`).join('')}</div>`:''}`:'<div class="detail-img no-img">한글</div>'}<div class="detail-content"><div class="detail-seller"><div class="avatar">${esc(p.sellerName.slice(0,1))}</div><div><strong>${esc(p.sellerName)}</strong><div class="hint">판매자 연락처 · ${esc(p.sellerContact)}</div></div></div><h1>${esc(p.name)}</h1><div class="detail-price">${price(p)}</div><p class="detail-desc">${esc(p.description)}</p><div class="hint">남은 수량 ${Math.max(0,Number(p.quantity||1)-Object.keys(reservations).length)} / 총 ${p.quantity||1}개</div>${owner?`<div class="owner-actions"><button id="editItem">수정</button><button id="soldItem">${p.sold?'판매중으로 되돌리기':'판매 완료'}</button><button id="deleteItem" class="danger">삭제</button></div>`:''}</div><div class="detail-actions"><button id="detailFav" class="detail-heart">${favorites.has(id)?'♥':'♡'}</button><button id="reserveBtn" class="reserve ${mine?'cancel':''}" ${(!mine&&(full||p.sold||owner))?'disabled':''}>${owner?'내가 등록한 물건':p.sold?'판매가 완료됐어요':mine?'예약 취소하기':full?'예약이 찼어요':'먼저 예약하기'}</button></div>`;
      $('#detail').classList.remove('hidden');if(pushHistory)history.pushState({item:id},'',`?invite=${INVITE}&item=${id}`);
      $$('[data-photo]').forEach(d=>d.onclick=()=>{$('#detailImage').src=p.photos[+d.dataset.photo];$$('.dot').forEach(x=>x.classList.toggle('on',x===d))});
      $('#detailFav').onclick=()=>{favorites.has(id)?favorites.delete(id):favorites.add(id);saveFav();openDetail(id,false)};
      $('#reserveBtn').onclick=()=>toggleReserve(id,mine);
      if(owner){$('#editItem').onclick=()=>openEditor(id);$('#soldItem').onclick=async()=>{await update(ref(db,`hangulMarket/products/${id}`),{sold:!p.sold,updatedAt:Date.now()});toast(p.sold?'다시 판매중이에요.':'판매 완료했어요.');closeDetail()};$('#deleteItem').onclick=async()=>{if(confirm('이 물건을 정말 삭제할까요?')){await remove(ref(db,`hangulMarket/products/${id}`));toast('삭제했어요.');closeDetail()}}}
    }
    async function toggleReserve(id,mine){
      if(mine){await remove(ref(db,`hangulMarket/products/${id}/reservations/${user.uid}`));toast('예약을 취소했어요.');return}
      const product=products[id];if(!product||product.sold)return toast('판매가 끝난 물건이에요.');
      const result=await runTransaction(ref(db,`hangulMarket/products/${id}/reservations`),r=>{r=r||{};if(Object.keys(r).length>=Number(product.quantity||1))return;r[user.uid]={nickname:profile.nickname,contact:profile.contact,at:Date.now()};return r});
      toast(result.committed?'예약했어요! 판매자에게 연락해 보세요.':'아쉽게도 방금 예약이 찼어요.');
    }
    function closeDetail(){currentId=null;$('#detail').classList.add('hidden');history.replaceState({},'',`?invite=${INVITE}`)}
    $('.back').onclick=closeDetail;window.onpopstate=()=>{const id=new URLSearchParams(location.search).get('item');id&&products[id]?openDetail(id,false):($('#detail').classList.add('hidden'),currentId=null)};
    $('#shareMarket').onclick=()=>share(location.origin+location.pathname+`?invite=${INVITE}`,'한글마켓에 놀러오세요');$('#shareItem').onclick=()=>share(location.origin+location.pathname+`?invite=${INVITE}&item=${currentId}`,'한글마켓 물건을 확인해 보세요');
    async function share(url,text){try{if(navigator.share)await navigator.share({title:'한글마켓',text,url});else{await navigator.clipboard.writeText(url);toast('공유 링크를 복사했어요.')}}catch(e){}}
    $('#addBtn').onclick=()=>openEditor();$('#closeEditor').onclick=()=>$('#editor').classList.add('hidden');
    function openEditor(id=null){editingId=id;const p=id?products[id]:null;photos=p?.photos?[...p.photos]:[];$('#editorTitle').textContent=id?'물건 수정':'물건 등록';$('#productName').value=p?.name||'';$('#price').value=p?.price??'';$('#priceType').value=p?.priceType||'price';$('#quantity').value=p?.quantity||1;$('#description').value=p?.description||'';renderPhotos();$('#editor').classList.remove('hidden')}
    function renderPhotos(){$('#photoCount').textContent=`${photos.length}/5`;$('#photos').innerHTML=`<label class="photo-add">＋<br>사진 추가<input id="photoInput" type="file" accept="image/*" multiple hidden></label>`+photos.map((src,i)=>`<div class="photo-preview"><img src="${src}" alt=""><button type="button" class="remove-photo" data-remove="${i}">×</button></div>`).join('');$('#photoInput').onchange=handlePhotos;$$('[data-remove]').forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.remove,1);renderPhotos()})}
    async function handlePhotos(e){const files=[...e.target.files].slice(0,5-photos.length);for(const file of files){if(!file.type.startsWith('image/'))continue;photos.push(await compress(file))}renderPhotos()}
    function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.74))};img.onerror=reject;img.src=url})}
    $('#priceType').onchange=()=>{const free=$('#priceType').value==='free';$('#price').disabled=free;if(free)$('#price').value=0};
    $('#productForm').onsubmit=async e=>{e.preventDefault();if(!photos.length)return toast('사진을 한 장 이상 추가해 주세요.');const old=editingId?products[editingId]:null,isEditing=!!editingId;const data={name:$('#productName').value.trim(),price:Number($('#price').value||0),priceType:$('#priceType').value,quantity:Number($('#quantity').value),description:$('#description').value.trim(),photos,owner:user.uid,sellerName:profile.nickname,sellerContact:profile.contact,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now(),sold:old?.sold||false,reservations:old?.reservations||{}};const btn=e.submitter;btn.disabled=true;btn.textContent='저장 중...';try{if(editingId)await set(ref(db,`hangulMarket/products/${editingId}`),data);else await set(push(ref(db,'hangulMarket/products')),data);$('#editor').classList.add('hidden');toast(isEditing?'수정했어요.':'물건을 등록했어요!')}catch(err){toast('저장하지 못했어요. 다시 시도해 주세요.')}finally{btn.disabled=false;btn.textContent='등록 완료'}};
    boot();
  </script>
</body>
</html>
