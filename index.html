<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>unimai – Free Online Games</title>
<meta name="description" content="Play free online games instantly on unimai.net – no downloads, no sign-up. Puzzle, arcade, action, sports and more.">
<meta name="theme-color" content="#4fd1e0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23ff4f8b'/><text x='32' y='45' font-size='38' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' fill='white'>u</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#62dbe8; --bg2:#3cc7d9;
  --cell:94px; --gap:16px; --radius:16px;
  --ink:#0d2b3e; --white:#fff;
  --font:"Fredoka", ui-rounded, "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font); color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #8cf0f7 0%, transparent 60%),
    radial-gradient(900px 700px at 110% 20%, #43c3e6 0%, transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, var(--cell));
  grid-auto-rows:var(--cell);
  grid-auto-flow:dense;
  gap:var(--gap);
  justify-content:center;
  padding:var(--gap);
}
.s{grid-column:span 1;grid-row:span 1}
.m{grid-column:span 2;grid-row:span 2}
.l{grid-column:span 3;grid-row:span 3}
.w{grid-column:span 2;grid-row:span 1}

/* ---------- brand tile ---------- */
.brand{
  grid-column:1 / span 2; grid-row:1;
  background:#fff; border-radius:var(--radius);
  box-shadow:0 6px 12px rgba(0,40,60,.18);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:10px 12px 10px;
  position:relative; z-index:2;
}
.logo{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.5px;display:flex;gap:1px;padding-top:2px}
.logo span:nth-child(1){color:#ff4f8b}
.logo span:nth-child(2){color:#ff9f1c}
.logo span:nth-child(3){color:#2ec4b6}
.logo span:nth-child(4){color:#3a86ff}
.logo span:nth-child(5){color:#8338ec}
.logo span:nth-child(6){color:#ff4f8b}
.brand-actions{display:flex;gap:8px}
.icon-btn{
  flex:1; height:34px; border:0; border-radius:10px;
  background:#eef7fb; color:#2a5470; font-size:17px;
  display:grid; place-items:center; transition:background .15s, transform .15s;
}
.icon-btn:hover{background:#dff0f8;transform:translateY(-1px)}
.icon-btn svg{width:20px;height:20px}

/* ---------- game tile ---------- */
.tile{
  position:relative; border-radius:var(--radius); overflow:hidden;
  box-shadow:0 6px 12px rgba(0,40,60,.18);
  transition:transform .18s cubic-bezier(.3,.7,.4,1.4), box-shadow .18s;
  background:#fff; isolation:isolate; outline:none;
}
.tile:hover,.tile:focus-visible{transform:scale(1.04) translateY(-2px);box-shadow:0 12px 24px rgba(0,40,60,.28);z-index:3}
.tile:focus-visible{box-shadow:0 0 0 4px #fff, 0 12px 24px rgba(0,40,60,.28)}
.art{
  position:absolute; inset:0;
  background:linear-gradient(var(--a,135deg), var(--c1), var(--c2));
  display:grid; place-items:center;
}
.art::before{ /* soft highlight */
  content:""; position:absolute; width:120%; aspect-ratio:1; left:-40%; top:-60%;
  background:radial-gradient(circle, rgba(255,255,255,.45), transparent 60%);
}
.art::after{ /* dots pattern */
  content:""; position:absolute; inset:0; opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.9) 1.5px, transparent 1.6px);
  background-size:14px 14px;
  mask-image:linear-gradient(180deg, transparent 40%, #000);
}
.emo{
  position:relative; z-index:1; line-height:1;
  font-size:calc(var(--cell) * .52);
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));
  transition:transform .25s cubic-bezier(.3,.7,.4,1.6);
}
.m .emo{font-size:calc(var(--cell) * 1.05)}
.l .emo{font-size:calc(var(--cell) * 1.6)}
.tile:hover .emo{transform:scale(1.08) rotate(-4deg)}
.big-title{
  position:absolute; z-index:2; top:10px; left:10px; right:10px;
  text-align:center; font-weight:700; color:#fff; line-height:.95;
  font-size:calc(var(--cell) * .34); letter-spacing:.5px; text-transform:uppercase;
  -webkit-text-stroke:2px rgba(0,0,0,.35); paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(0,0,0,.25);
}
.m .big-title{font-size:calc(var(--cell) * .24);top:8px}
.tag{
  position:absolute; z-index:2; left:50%; bottom:14px; transform:translateX(-50%) rotate(-3deg);
  width:max-content; max-width:92%; text-align:center;
  background:#ffd60a; color:#7a2e00; font-weight:700; font-size:calc(var(--cell) * .145); white-space:nowrap;
  padding:6px 12px; border-radius:999px; box-shadow:0 4px 0 rgba(0,0,0,.25);
}
.tile:hover .tag{opacity:0}
.owner{
  position:absolute; z-index:3; right:6px; bottom:6px;
  font-size:10px; font-weight:700; letter-spacing:.3px; white-space:nowrap;
  padding:3px 7px; border-radius:6px; color:#5c3b00; background:#ffe066;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}
.m .owner,.l .owner{right:8px;bottom:8px;font-size:11px}
.l .tag{bottom:40px}
.tile:hover .owner{opacity:0}
.label{
  position:absolute; z-index:3; left:0; right:0; bottom:0;
  padding:18px 8px 7px; color:#fff; font-weight:600; font-size:14px; text-align:center;
  background:linear-gradient(transparent, rgba(0,0,0,.65));
  transform:translateY(100%); transition:transform .18s ease;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tile:hover .label,.tile:focus-visible .label{transform:none}
.badge{
  position:absolute; z-index:3; top:6px; left:6px;
  font-size:10px; font-weight:700; letter-spacing:.5px;
  padding:3px 6px; border-radius:6px; color:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}
.badge.new{background:#ff4f8b}
.badge.hot{background:#ff7a00}
.badge.play{background:#22b573}
.m .badge,.l .badge{top:auto;bottom:8px;left:8px}
.tile:hover .badge{opacity:0}

/* ---------- category tiles ---------- */
.cat{
  grid-column:span 2; grid-row:span 1;
  display:flex; align-items:center; gap:10px; padding:0 14px;
  background:#fff; border-radius:var(--radius); border:0; text-align:left;
  box-shadow:0 6px 12px rgba(0,40,60,.18);
  font-size:17px; font-weight:600; color:var(--ink);
  transition:transform .15s, box-shadow .15s;
}
.cat:hover{transform:translateY(-3px);box-shadow:0 12px 20px rgba(0,40,60,.25)}
.cat .ci{
  width:58px; height:58px; border-radius:12px; flex:none;
  display:grid; place-items:center; font-size:32px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
}
.cat.active{outline:3px solid #ff4f8b}
.cats{padding-top:8px}
.section-title{
  grid-column:1 / -1; grid-row:span 1; align-self:end;
  color:#fff; font-size:26px; font-weight:700; margin:0; padding:0 4px 6px;
  text-shadow:0 2px 0 rgba(0,40,60,.25);
}

/* ---------- search / filter bar ---------- */
.topbar{
  position:fixed; z-index:20; top:14px; left:50%; transform:translate(-50%,-140%);
  width:min(560px, calc(100vw - 32px));
  background:#fff; border-radius:16px; box-shadow:0 14px 34px rgba(0,30,50,.3);
  display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px;
  transition:transform .25s cubic-bezier(.3,.7,.4,1.2);
}
.topbar.open{transform:translate(-50%,0)}
.topbar input{
  flex:1; border:0; outline:0; font:600 18px var(--font); color:var(--ink); min-width:0; background:transparent;
}
.topbar .count{font-size:13px;color:#5e7d91;white-space:nowrap}
.topbar button{border:0;background:#eef7fb;border-radius:10px;width:36px;height:36px;font-size:16px;color:#2a5470}
.empty{grid-column:1 / -1; grid-row:span 2; text-align:center; color:#fff; font-size:22px; font-weight:600; align-self:center}
.hidden{display:none !important}

footer{
  text-align:center; color:#fff; padding:24px 16px 40px; font-size:14px; opacity:.9;
}
footer a{text-decoration:underline}

/* ---------- player modal ---------- */
.player{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(6,30,45,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  padding:16px; animation:fade .2s ease;
}
.player[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.panel{
  width:min(1000px,100%); height:min(100%, 860px);
  background:#14243a; border-radius:20px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:0 30px 60px rgba(0,0,0,.4);
  animation:pop .25s cubic-bezier(.3,.7,.4,1.3);
}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.panel header{
  display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px;
  background:#1b2f4a; color:#fff;
}
.panel header .pe{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.panel header h2{margin:0;font-size:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel header button{border:0;background:#2a4365;color:#fff;width:40px;height:40px;border-radius:10px;font-size:18px}
.panel header button:hover{background:#355280}
.stage{
  flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
  padding:12px; position:relative;
  background:radial-gradient(circle at 50% 30%, #23426a, #0f1c2e 70%);
}
.stage canvas{display:block;border-radius:14px;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:100%;max-height:100%}
.stage iframe{width:100%;height:100%;border:0;border-radius:12px;background:#000}
.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#9fb6cf;font-size:13px;pointer-events:none}

.soon{color:#fff;text-align:center;max-width:460px}
.soon .big{font-size:96px;line-height:1}
.soon h3{font-size:30px;margin:12px 0 6px}
.soon p{color:#b8cce0;margin:0 0 18px}
.soon .picks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.soon .picks a{
  display:flex;align-items:center;gap:8px;background:#2a4365;padding:10px 14px;border-radius:12px;font-weight:600;
}
.soon .picks a:hover{background:#355280}

/* DOM-based games */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(440px,100%);}
.card{aspect-ratio:1;perspective:600px;border:0;padding:0;background:none}
.card .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden}
.card .f{background:linear-gradient(135deg,#ff4f8b,#8338ec);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card .f::after{content:"?";color:rgba(255,255,255,.7);font-size:34px;font-weight:700}
.card .b{background:#fff;transform:rotateY(180deg);font-size:clamp(28px,8vw,48px)}
.card.done .b{background:#d9ffe9}
.ghud{color:#fff;display:flex;gap:18px;justify-content:center;font-size:18px;font-weight:600;margin-bottom:12px}
.gwrap{display:flex;flex-direction:column;align-items:center;width:100%}
.gbtn{margin-top:14px;border:0;border-radius:12px;padding:10px 18px;background:#ff4f8b;color:#fff;font-size:17px;font-weight:600}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(360px,100%)}
.ttt button{aspect-ratio:1;border:0;border-radius:16px;background:#fff;font:700 clamp(40px,12vw,72px) var(--font);color:#ff4f8b;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ttt button.o{color:#3a86ff}
.ttt button.win{background:#ffe066}
.ttt button:disabled{cursor:default}

/* ---------- responsive ---------- */
@media (max-width:1100px){ :root{--cell:84px;--gap:14px} }
@media (max-width:540px){
  :root{--gap:10px;--radius:14px;--cell:calc((100vw - 32px - 3 * var(--gap)) / 4)}
  .grid{grid-template-columns:repeat(4, var(--cell));padding:16px}
  .logo{font-size:28px}
  .brand{padding:8px 10px}
  .icon-btn{height:30px}
  .cat{font-size:15px;padding:0 10px;gap:8px}
  .cat .ci{width:46px;height:46px;font-size:26px}
  .label{font-size:12px}
  .player{padding:0}
  .panel{border-radius:0;height:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div class="topbar" id="topbar" role="search">
  <span aria-hidden="true">🔎</span>
  <input id="q" type="search" placeholder="What do you want to play?" autocomplete="off" aria-label="Search games">
  <span class="count" id="count"></span>
  <button id="qclose" aria-label="Close search">✕</button>
</div>

<main class="grid" id="grid">
  <div class="brand">
    <a href="#" class="logo" aria-label="unimai home"><span>u</span><span>n</span><span>i</span><span>m</span><span>a</span><span>i</span></a>
    <div class="brand-actions">
      <button class="icon-btn" id="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg></button>
      <button class="icon-btn" id="search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
    </div>
  </div>
</main>
<section class="grid cats" id="cats" aria-labelledby="cats-title"></section>

<footer>
  © <span id="yr"></span> unimai.net · Free games, no downloads ·
  <a href="mailto:hello@unimai.net">Contact</a>
</footer>

<div class="player" id="player" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle">
    <header>
      <div class="pe" id="pemo"></div>
      <h2 id="ptitle"></h2>
      <button id="restart" aria-label="Restart">↻</button>
      <button id="fs" aria-label="Fullscreen">⛶</button>
      <button id="pclose" aria-label="Close">✕</button>
    </header>
    <div class="stage" id="stage"></div>
  </div>
</div>

<script>
/* =====================================================================
   GAME CATALOG
   Each entry:  name, emoji, c1/c2 (tile gradient), size (s|m|l), cat
   Optional:    play: id of a built-in game below
                url:  any embeddable HTML5 game URL (opens in an iframe)
                badge: "new" | "hot"
   Entries without play/url show a "coming soon" screen.
   ===================================================================== */
const GAMES = [
  {name:"Sky Coin Rush", emoji:"🪙", c1:"#ff8787", c2:"#c92a2a", size:"l", cat:"action",    tag:"Most famous on unimai game hub!", url:"scr/", badge:"hot"},
  {name:"Coin Rush Racing", emoji:"🏎️", c1:"#ffe066", c2:"#f08c00", size:"m", cat:"arcade",    url:"coin-rush/"},
  {name:"Blockwood",         emoji:"🌲", c1:"#8ce99a", c2:"#5c3d2e", size:"m", cat:"adventure", url:"blockwood/", badge:"new"},
  {name:"Lantern Lake",      emoji:"🎣", c1:"#ffd8a8", c2:"#1864ab", size:"m", cat:"casual",    url:"lantern-lake/"},
  {name:"Spy Phone Breaker", emoji:"🕵️", c1:"#ffd1ec", c2:"#7048e8", size:"m", cat:"action",    url:"spy-phone/"},
  {name:"Sound Orb",         emoji:"🔮", c1:"#a5d8ff", c2:"#5f3dc4", size:"m", cat:"casual",    url:"orb/"},
  {name:"Aura Obby 3D", emoji:"🐌", c1:"#74c0fc", c2:"#1c7ed6", size:"m", cat:"adventure", url:"obby/", badge:"new"},
  {name:"Jetpack Jump", emoji:"🚀", c1:"#8ce99a", c2:"#2b8a3e", size:"m", cat:"arcade",    url:"jump/"},
  {name:"토끼 점프", emoji:"🐰", c1:"#ffdeeb", c2:"#f06595", size:"m", cat:"casual",    url:"bunny/"},
  {name:"깡총데굴", emoji:"⚽", c1:"#b197fc", c2:"#5f3dc4", size:"m", cat:"arcade",    url:"hoproll/"},
  {name:"Noodle Snake",   emoji:"🐍", c1:"#b44cff", c2:"#5a1fd1", size:"s", cat:"arcade", play:"snake"},
  {name:"Puff Hop",       emoji:"🐤", c1:"#8ee3ff", c2:"#2f9bff", size:"s", cat:"arcade", play:"puff"},
  {name:"Tile Merge",     emoji:"🔢", c1:"#ffd6a5", c2:"#f28482", size:"s", cat:"puzzle", play:"merge"},
  {name:"Brick Blaster",  emoji:"🧱", c1:"#ff9f1c", c2:"#e63946", size:"s", cat:"arcade", play:"bricks"},
  {name:"Pop Rush",       emoji:"🫧", c1:"#ff8fab", c2:"#7b2cbf", size:"s", cat:"casual", play:"pop"},
  {name:"Memory Pairs",   emoji:"🃏", c1:"#fde68a", c2:"#f59e0b", size:"s", cat:"puzzle", play:"memory"},
  {name:"Tic Tac Brain",  emoji:"⭕", c1:"#ff006e", c2:"#ffbe0b", size:"s", cat:"puzzle", play:"ttt"},
];

const CATS = [
  {id:"arcade",    name:"Arcade",    emoji:"🕹️", c1:"#b44cff", c2:"#5a1fd1"},
  {id:"puzzle",    name:"Puzzle",    emoji:"🧩", c1:"#ffd166", c2:"#f28482"},
  {id:"action",    name:"Action",    emoji:"💥", c1:"#ff9f1c", c2:"#e63946"},
  {id:"casual",    name:"Casual",    emoji:"🍭", c1:"#ff8fab", c2:"#7b2cbf"},
  {id:"adventure", name:"Adventure", emoji:"🗺️", c1:"#80ed99", c2:"#38a3a5"},
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
GAMES.forEach(g => g.slug = (g.url && g.url.match(/^([a-z0-9-]+)\/$/)?.[1]) || slug(g.name));
const store = {
  get(k,d=0){ try{ const v=localStorage.getItem("unimai:"+k); return v==null?d:JSON.parse(v);}catch{ return d; } },
  set(k,v){ try{ localStorage.setItem("unimai:"+k, JSON.stringify(v)); }catch{} }
};
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- render grid ---------- */
const grid = $("#grid");
function tileHTML(g){
  const badge = g.badge ? `<span class="badge ${g.badge}">${g.badge.toUpperCase()}</span>`
              : g.play ? `<span class="badge play">▶ PLAY</span>` : "";
  const title = (g.size !== "s" ? `<span class="big-title">${esc(g.name)}</span>` : "") +
    (g.tag ? `<span class="tag">⭐ ${esc(g.tag)}</span>` : "") +
    (g.url ? `<span class="owner">👑 Owner made</span>` : "");
  return `<a class="tile ${g.size}" href="#/${g.slug}" data-cat="${g.cat}" data-name="${esc(g.name.toLowerCase())}" aria-label="${esc(g.name)}">
    <div class="art" style="--c1:${g.c1};--c2:${g.c2};${g.a?`--a:${g.a}`:""}"><span class="emo">${g.emoji}</span></div>
    ${title}${badge}<span class="label">${esc(g.name)}</span></a>`;
}
grid.insertAdjacentHTML("beforeend",
  GAMES.map(tileHTML).join("") +
  `<div class="empty hidden" id="empty">No games found 😢</div>`);
const cats = $("#cats");
cats.insertAdjacentHTML("beforeend",
  `<h2 class="section-title" id="cats-title">Categories</h2>` +
  CATS.map(c => `<button class="cat" data-filter="${c.id}"><span class="ci" style="--c1:${c.c1};--c2:${c.c2}">${c.emoji}</span>${c.name}</button>`).join("")
);
$("#yr").textContent = new Date().getFullYear();

/* ---------- search & category filter ---------- */
const topbar = $("#topbar"), q = $("#q");
let activeCat = null;
function applyFilter(){
  const term = q.value.trim().toLowerCase();
  let n = 0;
  grid.querySelectorAll(".tile").forEach(t => {
    const ok = (!term || t.dataset.name.includes(term) || t.dataset.cat.includes(term)) && (!activeCat || t.dataset.cat === activeCat);
    t.classList.toggle("hidden", !ok); if (ok) n++;
  });
  $("#empty").classList.toggle("hidden", n > 0);
  cats.querySelectorAll(".cat").forEach(b => b.classList.toggle("active", b.dataset.filter === activeCat));
  $("#count").textContent = (term || activeCat) ? `${n} game${n===1?"":"s"}` : "";
}
function openSearch(){ topbar.classList.add("open"); setTimeout(()=>q.focus(), 50); }
function closeSearch(){ topbar.classList.remove("open"); q.value=""; activeCat=null; applyFilter(); }
$("#search").onclick = openSearch;
$("#qclose").onclick = closeSearch;
$("#home").onclick = () => { closeSearch(); scrollTo({top:0,behavior:"smooth"}); };
q.addEventListener("input", applyFilter);
cats.addEventListener("click", e => {
  const b = e.target.closest(".cat"); if (!b) return;
  activeCat = activeCat === b.dataset.filter ? null : b.dataset.filter;
  if (activeCat) { topbar.classList.add("open"); q.placeholder = `Search in ${b.textContent.trim()}…`; }
  else q.placeholder = "What do you want to play?";
  applyFilter(); scrollTo({top:0,behavior:"smooth"});
});

/* ---------- player modal ---------- */
const player = $("#player"), stage = $("#stage");
let cleanup = null, current = null;
function openGame(g){
  current = g;
  if (cleanup) { cleanup(); cleanup = null; }
  stage.innerHTML = "";
  $("#ptitle").textContent = g.name;
  const pe = $("#pemo"); pe.textContent = g.emoji; pe.style.cssText = `--c1:${g.c1};--c2:${g.c2}`;
  $("#restart").hidden = !g.play;
  if (g.play && IMPL[g.play]) cleanup = IMPL[g.play](stage, g);
  else if (g.url) stage.innerHTML = `<iframe src="${esc(g.url)}" allow="autoplay; fullscreen; gamepad; microphone" allowfullscreen></iframe>`;
  else {
    const picks = GAMES.filter(x => x.url).sort(() => Math.random()-.5).slice(0,3);
    stage.innerHTML = `<div class="soon"><div class="big">${g.emoji}</div><h3>Coming soon!</h3>
      <p>${esc(g.name)} is on its way. Try one of these while you wait:</p>
      <div class="picks">${picks.map(p=>`<a href="#/${p.slug}">${p.emoji} ${esc(p.name)}</a>`).join("")}</div></div>`;
  }
  if (player.hidden) { player.hidden = false; document.body.style.overflow = "hidden"; }
  document.title = `${g.name} – unimai`;
}
function closeGame(){
  if (cleanup) { cleanup(); cleanup = null; }
  stage.innerHTML = ""; player.hidden = true; current = null;
  document.body.style.overflow = ""; document.title = "unimai – Free Online Games";
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function route(){
  const m = location.hash.match(/^#\/(.+)/);
  const g = m && GAMES.find(x => x.slug === m[1]);
  g ? openGame(g) : (player.hidden || closeGame());
}
window.addEventListener("hashchange", route);
$("#pclose").onclick = () => history.length > 1 && location.hash ? (location.hash = "") : closeGame();
player.addEventListener("click", e => { if (e.target === player) $("#pclose").click(); });
$("#restart").onclick = () => current && openGame(current);
$("#fs").onclick = () => {
  const el = $(".panel");
  document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.().catch(()=>{});
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (!player.hidden) $("#pclose").click(); else closeSearch(); }
  if (e.key === "/" && player.hidden && document.activeElement !== q) { e.preventDefault(); openSearch(); }
  if (!player.hidden && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
});

/* =====================================================================
   BUILT-IN GAMES – each takes the stage element and returns cleanup()
   ===================================================================== */
function kit(root, w, h, hint){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.style.width = `min(100%, calc((100dvh - 130px) * ${w/h}))`;
  root.appendChild(c);
  if (hint) root.insertAdjacentHTML("beforeend", `<div class="hint">${hint}</div>`);
  const ctx = c.getContext("2d");
  const offs = []; let raf = 0, alive = true;
  const on = (t, ev, f, o) => { t.addEventListener(ev, f, o); offs.push(() => t.removeEventListener(ev, f, o)); };
  const loop = fn => { let last = performance.now();
    const step = now => { if (!alive) return; const dt = Math.min(.05, (now-last)/1000); last = now; fn(dt); raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); };
  const pos = e => { const r = c.getBoundingClientRect(); const p = e.touches ? e.touches[0] || e.changedTouches[0] : e;
    return { x:(p.clientX-r.left)*w/r.width, y:(p.clientY-r.top)*h/r.height }; };
  const swipe = cb => { let s = null;
    on(c, "touchstart", e => { s = e.touches[0]; }, {passive:true});
    on(c, "touchend", e => { if (!s) return; const t = e.changedTouches[0], dx = t.clientX-s.clientX, dy = t.clientY-s.clientY; s = null;
      if (Math.max(Math.abs(dx),Math.abs(dy)) < 24) return cb(null);
      cb(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "R" : "L") : (dy > 0 ? "D" : "U")); }); };
  const key = e => ({ArrowUp:"U",KeyW:"U",ArrowDown:"D",KeyS:"D",ArrowLeft:"L",KeyA:"L",ArrowRight:"R",KeyD:"R"}[e.code]);
  const text = (s, x, y, size=20, color="#fff", weight=700, align="center") => {
    ctx.font = `${weight} ${size}px Fredoka, system-ui, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); };
  const banner = (title, sub) => { ctx.fillStyle = "rgba(8,20,40,.6)"; ctx.fillRect(0,0,w,h); text(title, w/2, h/2-18, 40); text(sub, w/2, h/2+22, 18, "#cfe3ff", 500); };
  const rr = (x, y, ww, hh, r) => { ctx.beginPath(); ctx.roundRect(x, y, ww, hh, r); ctx.fill(); };
  const cleanup = () => { alive = false; cancelAnimationFrame(raf); offs.forEach(f => f()); };
  return {c, ctx, w, h, on, loop, pos, swipe, key, text, banner, rr, cleanup};
}

const IMPL = {};

/* ---------- Noodle Snake ---------- */
IMPL.snake = root => {
  const N = 20, S = 22, k = kit(root, N*S, N*S + 50, "Arrow keys / WASD or swipe");
  const {ctx, text, banner, rr} = k;
  let snake, dir, next, food, score, state = "ready", acc = 0, best = store.get("snake");
  const placeFood = () => { do food = {x:Math.random()*N|0, y:Math.random()*N|0}; while (snake.some(p => p.x===food.x && p.y===food.y)); };
  const reset = () => { snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}]; dir = next = "R"; score = 0; acc = 0; placeFood(); };
  const opp = {U:"D",D:"U",L:"R",R:"L"};
  const turn = d => { if (state !== "play") { if (state==="over") reset(); state = "play"; return; } if (d && d !== opp[dir]) next = d; };
  reset();
  k.on(window, "keydown", e => { const d = k.key(e); if (d || e.code==="Space" || e.code==="Enter") turn(d); });
  k.swipe(turn); k.on(k.c, "mousedown", () => state !== "play" && turn(null));
  k.loop(dt => {
    if (state === "play") {
      acc += dt; const speed = Math.max(.06, .13 - score*.002);
      while (acc > speed) { acc -= speed; dir = next;
        const h = {...snake[0]}; h.x += dir==="R"?1:dir==="L"?-1:0; h.y += dir==="D"?1:dir==="U"?-1:0;
        if (h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)) { state="over"; if (score>best) store.set("snake", best=score); break; }
        snake.unshift(h);
        if (h.x===food.x && h.y===food.y) { score++; placeFood(); } else snake.pop();
      }
    }
    ctx.fillStyle = "#2b1155"; ctx.fillRect(0,0,k.w,k.h);
    text(`Score ${score}`, 16, 25, 22, "#fff", 700, "left"); text(`Best ${best}`, k.w-16, 25, 22, "#e0b3ff", 600, "right");
    ctx.save(); ctx.translate(0,50);
    for (let y=0;y<N;y++) for (let x=0;x<N;x++){ ctx.fillStyle = (x+y)%2 ? "#3d1a78" : "#441d85"; ctx.fillRect(x*S,y*S,S,S); }
    ctx.font = `${S-2}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🍎", food.x*S+S/2, food.y*S+S/2+1);
    snake.forEach((p,i) => { ctx.fillStyle = i ? `hsl(${120+i*4},80%,${55-Math.min(i,20)}%)` : "#7bff8a"; rr(p.x*S+1,p.y*S+1,S-2,S-2,7); });
    const hd = snake[0]; ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(hd.x*S+S/2-4,hd.y*S+S/2-3,2.6,0,7); ctx.arc(hd.x*S+S/2+4,hd.y*S+S/2-3,2.6,0,7); ctx.fill();
    ctx.restore();
    if (state==="ready") banner("Noodle Snake", "Press any arrow or tap to start");
    if (state==="over") banner("Game Over", `Score ${score} · tap or press a key`);
  });
  return k.cleanup;
};

/* ---------- Puff Hop ---------- */
IMPL.puff = root => {
  const k = kit(root, 360, 600, "Tap, click or Space to flap");
  const {ctx, text, banner, rr, w, h} = k;
  let y, vy, pipes, t, score, state = "ready", best = store.get("puff");
  const clouds = Array.from({length:5}, (_,i) => ({x:i*90, y:40+Math.random()*200, s:.6+Math.random()*.6}));
  const reset = () => { y = h/2; vy = 0; pipes = []; t = 0; score = 0; };
  const flap = () => { if (state==="over") { reset(); state="ready"; return; } if (state==="ready") state="play"; vy = -380; };
  reset();
  k.on(window, "keydown", e => { if (["Space","ArrowUp","KeyW","Enter"].includes(e.code)) flap(); });
  k.on(k.c, "pointerdown", flap);
  k.loop(dt => {
    if (state === "play") {
      vy += 1250*dt; y += vy*dt; t -= dt;
      if (t <= 0) { t = 1.45; pipes.push({x:w+30, gap: 130 + Math.random()*(h-330), done:false}); }
      pipes.forEach(p => { p.x -= 150*dt; if (!p.done && p.x+30 < 90) { p.done = true; score++; } });
      pipes = pipes.filter(p => p.x > -80);
      const hit = y > h-60-14 || y < 14 || pipes.some(p => 90+14 > p.x-30 && 90-14 < p.x+30 && (y-14 < p.gap || y+14 > p.gap+160));
      if (hit) { state = "over"; if (score>best) store.set("puff", best=score); }
    } else if (state === "ready") { y = h/2 + Math.sin(performance.now()/300)*10; }
    const g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,"#7fdcff"); g.addColorStop(1,"#d7f6ff"); ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    clouds.forEach(c => { if (state==="play") c.x -= 20*c.s*dt; if (c.x < -80) c.x = w+40;
      ctx.beginPath(); ctx.arc(c.x,c.y,20*c.s,0,7); ctx.arc(c.x+22*c.s,c.y-8*c.s,24*c.s,0,7); ctx.arc(c.x+46*c.s,c.y,18*c.s,0,7); ctx.fill(); });
    pipes.forEach(p => { ctx.fillStyle = "#38b000"; rr(p.x-30, -10, 60, p.gap+10, 10); rr(p.x-30, p.gap+160, 60, h, 10);
      ctx.fillStyle = "#2d8a00"; rr(p.x-34, p.gap-24, 68, 24, 8); rr(p.x-34, p.gap+160, 68, 24, 8); });
    ctx.fillStyle = "#e9c46a"; ctx.fillRect(0,h-60,w,60); ctx.fillStyle = "#90be6d"; ctx.fillRect(0,h-60,w,12);
    ctx.save(); ctx.translate(90, y); ctx.rotate(Math.max(-.5, Math.min(1.2, vy/600)));
    ctx.fillStyle = "#ffd60a"; ctx.beginPath(); ctx.arc(0,0,16,0,7); ctx.fill();
    ctx.fillStyle = "#ffb703"; ctx.beginPath(); ctx.ellipse(-4,4,9,6,-.4,0,7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(6,-5,6,0,7); ctx.fill(); ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(8,-5,3,0,7); ctx.fill();
    ctx.fillStyle = "#fb5607"; ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(24,3); ctx.lineTo(13,7); ctx.fill();
    ctx.restore();
    text(score, w/2, 60, 52, "#fff");
    if (state==="ready") banner("Puff Hop", `Tap to flap · Best ${best}`);
    if (state==="over") banner("Ouch!", `Score ${score} · Best ${best} · tap to retry`);
  });
  return k.cleanup;
};

/* ---------- Tile Merge (2048-style) ---------- */
IMPL.merge = root => {
  const k = kit(root, 420, 520, "Arrow keys / WASD or swipe");
  const {ctx, text, rr, w} = k;
  const COL = {2:"#fff3e0",4:"#ffe0b2",8:"#ffb74d",16:"#ff9800",32:"#ff7043",64:"#f4511e",128:"#ffd54f",256:"#ffca28",512:"#ffc107",1024:"#ab47bc",2048:"#7b1fa2"};
  let b, score, over, best = store.get("merge");
  const add = () => { const e = b.map((v,i)=>v?-1:i).filter(i=>i>=0); if (e.length) b[e[Math.random()*e.length|0]] = Math.random()<.9?2:4; };
  const reset = () => { b = Array(16).fill(0); score = 0; over = false; add(); add(); };
  const canMove = () => b.some((v,i)=> !v || (i%4<3 && v===b[i+1]) || (i<12 && v===b[i+4]));
  const move = d => {
    if (over) return reset();
    let moved = false;
    for (let i=0;i<4;i++){
      const idx = [0,1,2,3].map(j => d==="L"? i*4+j : d==="R"? i*4+3-j : d==="U"? j*4+i : (3-j)*4+i);
      const vals = idx.map(x=>b[x]).filter(Boolean), out = [];
      for (let j=0;j<vals.length;j++){ if (vals[j]===vals[j+1]) { out.push(vals[j]*2); score += vals[j]*2; j++; } else out.push(vals[j]); }
      while (out.length<4) out.push(0);
      idx.forEach((x,j)=>{ if (b[x]!==out[j]) moved = true; b[x] = out[j]; });
    }
    if (moved) { add(); if (score>best) store.set("merge", best=score); if (!canMove()) over = true; }
  };
  reset();
  k.on(window, "keydown", e => { const d = k.key(e); if (d) move(d); });
  k.swipe(d => d && move(d));
  k.loop(() => {
    ctx.fillStyle = "#fdf0e3"; ctx.fillRect(0,0,w,k.h);
    text("Tile Merge", 20, 40, 30, "#7a4a2a", 700, "left");
    ctx.fillStyle="#bb8f6e"; rr(230,16,85,52,10); rr(322,16,85,52,10);
    text("SCORE",272,32,12,"#f7e3d0",600); text(score,272,52,20);
    text("BEST",364,32,12,"#f7e3d0",600); text(best,364,52,20);
    ctx.fillStyle="#bb8f6e"; rr(10,100,400,400,16);
    b.forEach((v,i)=>{ const x=22+(i%4)*96, y=112+(i/4|0)*96;
      ctx.fillStyle = v ? (COL[v]||"#4a148c") : "#d6b89d"; rr(x,y,88,88,12);
      if (v) text(v, x+44, y+46, v<100?40:v<1000?32:26, v<=4?"#7a4a2a":"#fff"); });
    if (over) { ctx.fillStyle="rgba(253,240,227,.75)"; ctx.fillRect(10,100,400,400); text("No more moves!",210,280,32,"#7a4a2a"); text("Press any arrow / swipe to restart",210,316,16,"#7a4a2a",500); }
  });
  return k.cleanup;
};

/* ---------- Brick Blaster ---------- */
IMPL.bricks = root => {
  const k = kit(root, 480, 620, "Move with mouse / finger or ←→ · tap or Space to launch");
  const {ctx, text, banner, rr, w, h} = k;
  const COLORS = ["#ff4f8b","#ff9f1c","#ffd60a","#57cc99","#4cc9f0","#8338ec"];
  let px, ball, bricks, lives, score, level, state = "ready", keys = {}, best = store.get("bricks");
  const build = () => { bricks = []; for (let r=0;r<6;r++) for (let c=0;c<8;c++) bricks.push({x:12+c*57, y:80+r*26, r}); };
  const serve = () => { ball = {x:px, y:h-62, vx:0, vy:0, stuck:true}; };
  const reset = () => { px = w/2; lives = 3; score = 0; level = 1; build(); serve(); };
  const launch = () => { if (state==="over") { reset(); state="ready"; return; } state = "play";
    if (ball.stuck) { const sp = 340 + level*30; ball.stuck=false; ball.vx = (Math.random()-.5)*sp*.8; ball.vy = -sp; } };
  reset();
  k.on(k.c, "pointermove", e => { px = k.pos(e).x; });
  k.on(k.c, "touchmove", e => { px = k.pos(e).x; e.preventDefault(); }, {passive:false});
  k.on(k.c, "pointerdown", e => { px = k.pos(e).x; launch(); });
  k.on(window, "keydown", e => { keys[e.code] = true; if (e.code==="Space"||e.code==="ArrowUp") launch(); });
  k.on(window, "keyup", e => { keys[e.code] = false; });
  k.loop(dt => {
    if (keys.ArrowLeft||keys.KeyA) px -= 520*dt;
    if (keys.ArrowRight||keys.KeyD) px += 520*dt;
    px = Math.max(50, Math.min(w-50, px));
    if (ball.stuck) { ball.x = px; }
    else if (state==="play") {
      ball.x += ball.vx*dt; ball.y += ball.vy*dt;
      if (ball.x<8) { ball.x=8; ball.vx*=-1; } if (ball.x>w-8) { ball.x=w-8; ball.vx*=-1; } if (ball.y<8) { ball.y=8; ball.vy*=-1; }
      if (ball.vy>0 && ball.y>h-58 && ball.y<h-38 && Math.abs(ball.x-px)<58) {
        const sp = Math.hypot(ball.vx,ball.vy)*1.01, a = (ball.x-px)/58*1.05;
        ball.vx = Math.sin(a)*sp; ball.vy = -Math.cos(a)*sp; ball.y = h-58; }
      for (const br of bricks) {
        if (ball.x+8>br.x && ball.x-8<br.x+53 && ball.y+8>br.y && ball.y-8<br.y+22) {
          const ox = Math.min(ball.x+8-br.x, br.x+53-(ball.x-8)), oy = Math.min(ball.y+8-br.y, br.y+22-(ball.y-8));
          if (ox<oy) ball.vx*=-1; else ball.vy*=-1;
          br.dead = true; score += (6-br.r)*10; break; } }
      bricks = bricks.filter(b=>!b.dead);
      if (!bricks.length) { level++; build(); serve(); state = "ready"; }
      if (ball.y>h+20) { lives--; if (lives<=0) { state="over"; if (score>best) store.set("bricks", best=score); } else { serve(); state="ready"; } }
    }
    const g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,"#1d1340"); g.addColorStop(1,"#3a0f4f"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    text(`Score ${score}`, 14, 32, 20, "#fff", 700, "left"); text(`Level ${level}`, w/2, 32, 20, "#ffd60a"); text("❤️".repeat(Math.max(0,lives)), w-14, 32, 18, "#fff", 400, "right");
    bricks.forEach(b => { ctx.fillStyle = COLORS[b.r]; rr(b.x,b.y,53,22,6); ctx.fillStyle="rgba(255,255,255,.3)"; rr(b.x+4,b.y+3,45,6,3); });
    ctx.fillStyle = "#fff"; rr(px-50, h-44, 100, 14, 7);
    ctx.fillStyle = "#ffd60a"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, 7); ctx.fill();
    if (state==="ready" && ball.stuck && score===0 && level===1) banner("Brick Blaster", `Tap or Space to launch · Best ${best}`);
    if (state==="over") banner("Game Over", `Score ${score} · tap to play again`);
  });
  return k.cleanup;
};

/* ---------- Pop Rush ---------- */
IMPL.pop = root => {
  const k = kit(root, 400, 600, "Pop the bubbles before they vanish!");
  const {ctx, text, banner, w, h} = k;
  let bubbles, lives, score, spawn, elapsed, state = "ready", fx = [], best = store.get("pop");
  const reset = () => { bubbles = []; lives = 3; score = 0; spawn = 0; elapsed = 0; fx = []; };
  reset();
  k.on(k.c, "pointerdown", e => {
    if (state !== "play") { reset(); state = "play"; return; }
    const p = k.pos(e);
    for (let i=bubbles.length-1;i>=0;i--){ const b = bubbles[i];
      if (Math.hypot(p.x-b.x,p.y-b.y) < b.r+6) { bubbles.splice(i,1); score += Math.round(10 + (b.max-b.r)); fx.push({x:b.x,y:b.y,t:0,hue:b.hue}); return; } }
  });
  k.loop(dt => {
    if (state === "play") {
      elapsed += dt; spawn -= dt;
      if (spawn <= 0) { spawn = Math.max(.35, 1.1 - elapsed*.02); const max = 26 + Math.random()*26;
        bubbles.push({x:max+Math.random()*(w-2*max), y:80+max+Math.random()*(h-140-2*max), r:0, max, t:0, life: Math.max(1.3, 2.6-elapsed*.03), hue:Math.random()*360}); }
      bubbles.forEach(b => { b.t += dt; const u = b.t/b.life; b.r = b.max*Math.sin(Math.min(1,u)*Math.PI); });
      const missed = bubbles.filter(b => b.t >= b.life).length;
      if (missed) { lives -= missed; bubbles = bubbles.filter(b => b.t < b.life);
        if (lives <= 0) { state = "over"; if (score>best) store.set("pop", best=score); } }
    }
    const g = ctx.createRadialGradient(w/2,h/3,40,w/2,h/2,h); g.addColorStop(0,"#ff8fab"); g.addColorStop(1,"#5a189a"); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    text(`Score ${score}`, 16, 32, 22, "#fff", 700, "left"); text("💖".repeat(Math.max(0,lives)), w-16, 32, 20, "#fff", 400, "right");
    bubbles.forEach(b => { if (b.r<1) return;
      const bg = ctx.createRadialGradient(b.x-b.r/3,b.y-b.r/3,b.r/6,b.x,b.y,b.r);
      bg.addColorStop(0,"rgba(255,255,255,.95)"); bg.addColorStop(.35,`hsla(${b.hue},90%,70%,.85)`); bg.addColorStop(1,`hsla(${b.hue},90%,50%,.9)`);
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); });
    fx = fx.filter(f => (f.t += dt) < .4);
    fx.forEach(f => { ctx.strokeStyle = `hsla(${f.hue},100%,85%,${1-f.t/.4})`; ctx.lineWidth = 4;
      for (let i=0;i<8;i++){ const a=i*Math.PI/4, r1=10+f.t*90, r2=r1+12; ctx.beginPath(); ctx.moveTo(f.x+Math.cos(a)*r1,f.y+Math.sin(a)*r1); ctx.lineTo(f.x+Math.cos(a)*r2,f.y+Math.sin(a)*r2); ctx.stroke(); } });
    if (state==="ready") banner("Pop Rush", `Tap to start · Best ${best}`);
    if (state==="over") banner("Popped out!", `Score ${score} · Best ${best} · tap to retry`);
  });
  return k.cleanup;
};

/* ---------- Memory Pairs (DOM) ---------- */
IMPL.memory = root => {
  const EMO = ["🦊","🐼","🐸","🦄","🐙","🐝","🍓","🌈"];
  const wrap = document.createElement("div"); wrap.className = "gwrap"; root.appendChild(wrap);
  let timer = 0, iv;
  const start = () => {
    clearInterval(iv); timer = 0;
    const deck = [...EMO, ...EMO].sort(() => Math.random()-.5);
    wrap.innerHTML = `<div class="ghud"><span>Moves: <b id="mv">0</b></span><span>Time: <b id="tm">0</b>s</span><span>Best: <b>${store.get("memory") || "–"}</b></span></div>
      <div class="memory">${deck.map(e=>`<button class="card" data-e="${e}" aria-label="card"><div class="in"><div class="f"></div><div class="b">${e}</div></div></button>`).join("")}</div>`;
    let open = [], moves = 0, done = 0, lock = false;
    iv = setInterval(() => { const t = wrap.querySelector("#tm"); if (t) t.textContent = ++timer; }, 1000);
    wrap.querySelector(".memory").onclick = e => {
      const c = e.target.closest(".card"); if (!c || lock || c.classList.contains("up") || c.classList.contains("done")) return;
      c.classList.add("up"); open.push(c);
      if (open.length === 2) { moves++; wrap.querySelector("#mv").textContent = moves; lock = true;
        const [a,b] = open;
        setTimeout(() => {
          if (a.dataset.e === b.dataset.e) { a.classList.add("done"); b.classList.add("done"); done++; }
          a.classList.remove("up"); b.classList.remove("up"); open = []; lock = false;
          if (done === EMO.length) { clearInterval(iv);
            const best = store.get("memory"); if (!best || moves < best) store.set("memory", moves);
            wrap.insertAdjacentHTML("beforeend", `<div class="ghud" style="margin-top:14px">🎉 Cleared in ${moves} moves, ${timer}s!</div><button class="gbtn">Play again</button>`);
            wrap.querySelector(".gbtn").onclick = start; }
        }, a.dataset.e === b.dataset.e ? 250 : 700);
      }
    };
  };
  start();
  return () => clearInterval(iv);
};

/* ---------- Tic Tac Brain (DOM, minimax) ---------- */
IMPL.ttt = root => {
  const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const wrap = document.createElement("div"); wrap.className = "gwrap"; root.appendChild(wrap);
  const tally = store.get("ttt", {w:0,l:0,d:0});
  const result = b => { for (const l of L) if (b[l[0]] && b[l[0]]===b[l[1]] && b[l[0]]===b[l[2]]) return {p:b[l[0]], l}; return b.every(Boolean) ? {p:"draw"} : null; };
  const mm = (b, turn, depth=0) => { const r = result(b); if (r) return r.p==="O" ? 10-depth : r.p==="X" ? depth-10 : 0;
    const scores = b.map((v,i) => { if (v) return null; b[i] = turn; const s = mm(b, turn==="O"?"X":"O", depth+1); b[i] = ""; return s; }).filter(s=>s!==null);
    return turn==="O" ? Math.max(...scores) : Math.min(...scores); };
  let to;
  const start = () => {
    const b = Array(9).fill(""); let busy = false;
    wrap.innerHTML = `<div class="ghud"><span>You ❌ ${tally.w}</span><span>Draw ${tally.d}</span><span>Brain ⭕ ${tally.l}</span></div>
      <div class="ttt">${b.map((_,i)=>`<button data-i="${i}" aria-label="cell ${i+1}"></button>`).join("")}</div><div class="ghud" id="msg" style="margin-top:14px">Your turn!</div>`;
    const cells = [...wrap.querySelectorAll(".ttt button")], msg = wrap.querySelector("#msg");
    const end = r => { cells.forEach(c=>c.disabled=true);
      if (r.l) r.l.forEach(i=>cells[i].classList.add("win"));
      if (r.p==="X") { tally.w++; msg.textContent = "🎉 You win!"; } else if (r.p==="O") { tally.l++; msg.textContent = "🧠 Brain wins!"; } else { tally.d++; msg.textContent = "🤝 Draw!"; }
      store.set("ttt", tally); wrap.insertAdjacentHTML("beforeend", `<button class="gbtn">Play again</button>`); wrap.querySelector(".gbtn").onclick = start; };
    const put = (i, p) => { b[i] = p; cells[i].textContent = p==="X" ? "✕" : "◯"; cells[i].classList.toggle("o", p==="O"); cells[i].disabled = true; };
    wrap.querySelector(".ttt").onclick = e => {
      const c = e.target.closest("button"); if (!c || busy || b[c.dataset.i]) return;
      put(+c.dataset.i, "X"); let r = result(b); if (r) return end(r);
      busy = true; msg.textContent = "Brain is thinking…";
      to = setTimeout(() => {
        const free = b.map((v,i)=>v?-1:i).filter(i=>i>=0);
        let pick;
        if (Math.random() < .2) pick = free[Math.random()*free.length|0];          // a little human error
        else { let bestS = -Infinity; for (const i of free) { b[i]="O"; const s = mm(b,"X",1); b[i]=""; if (s>bestS) { bestS=s; pick=i; } } }
        put(pick, "O"); busy = false; msg.textContent = "Your turn!";
        r = result(b); if (r) end(r);
      }, 380);
    };
  };
  start();
  return () => clearTimeout(to);
};

route();
