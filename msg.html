<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.S.G. FILES (CLASSIFIED)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; min-height:100%; }
body { font-family:'Inter',system-ui,sans-serif; background:#14161a; color:#e8e4d8; }
.mono { font-family:'Share Tech Mono',ui-monospace,monospace; }
::-webkit-scrollbar { width:0; height:0; }
@keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.15} }
@keyframes bob     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes sway    { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
@keyframes stomp   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px) } }
@keyframes shake   { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)} 75%{transform:translate(3px,-2px)} }
@keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes stampIn { 0%{opacity:0;transform:scale(2.4) rotate(-18deg)} 60%{opacity:1;transform:scale(.94) rotate(-11deg)} 100%{transform:scale(1) rotate(-11deg)} }
@keyframes scan    { from{transform:translateY(-100%)} to{transform:translateY(1400%)} }
@keyframes flyR    { from{transform:translateX(0)} to{transform:translateX(360px)} }
@keyframes boom    { 0%{opacity:0;transform:scale(.2)} 30%{opacity:1;transform:scale(1.15)} 100%{opacity:0;transform:scale(1.5)} }
.tapbtn:active { transform:scale(.95); }
</style>
</head>
<body class="notranslate">
<div id="app"></div>
<script>
// ── M.S.G. FILES (CLASSIFIED) ─────────────────────────────────────────────
//  Ministry of Squirrel Group. 하루 한 편, 날짜를 씨앗으로 삼는 결정론적 작전 영상.
//  같은 날짜 = 누가 열어도 똑같은 파일.
const K_STORE = 'family-msg-files-v1';

// ── 씨앗 난수 (mulberry32) ───────────────────────────────────
function hashStr(s) {
  let h = 2166136261;
  for (let i=0; i<s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const ri   = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));

// ── 작전 재료 ────────────────────────────────────────────────
const COMMANDER = 'HEAD SQUIRREL';
const THREATS = [
  {n:'KAIDU',        d:'a horde that chews through concrete', kind:'horde'},
  {n:'GODZILLA',     d:'thirty metres of very bad mood',      kind:'kaiju'},
  {n:'THE MAGPIE KING', d:'steals first, explains never',     kind:'bird'},
  {n:'MOLE ARMOUR DIV.', d:'comes up from underneath',        kind:'horde'},
  {n:'ACORN BLIGHT',  d:'turns a whole store to dust',        kind:'cloud'},
  {n:'THE VACUUM',    d:'human machine, no negotiation',      kind:'kaiju'},
  {n:'CAT UNIT NINE', d:'silent until it is far too late',    kind:'cat'},
  {n:'THE SNOW WALL', d:'moving south at walking pace',       kind:'cloud'}
];
const SQUADS = ['ACORN', 'PINE', 'THUNDER', 'HOLLOW', 'IRON TAIL', 'BIRCH', 'EMBER', 'FOG'];
const WEAPONS = ['BAZOOKAS', 'NUT MORTARS', 'PINECONE ROCKETS', 'TAIL-SPIN BLADES', 'ACORN ARTILLERY', 'SHELL LAUNCHERS'];
const SECTORS = ['THE OLD MAILBOX', 'BIRCH STAND', 'STEPPING STONES', 'OAKRIDGE HILL', 'THE FIR HOLLOW', 'CITY PARK BENCH', 'LIGHTHOUSE YARD', 'THE FALLEN WALL'];
const ORDER_VERBS = [
  'HOLD THE LINE', 'PUSH THEM BACK', 'DO NOT LET IT REACH THE STORE',
  'FIRE ON MY MARK', 'EVACUATE THE PUPS FIRST', 'TAKE THE HIGH BRANCH'
];
const OUTCOMES = [
  {t:'THREAT NEUTRALISED',    s:'All squads home. Two tails singed.'},
  {t:'THREAT DRIVEN OFF',     s:'It went east. It will be back.'},
  {t:'STORE HELD',            s:'Not one acorn lost. That is the whole report.'},
  {t:'TACTICAL WITHDRAWAL',   s:'The floor is gone. Everyone is not.'},
  {t:'THREAT NEUTRALISED',    s:'The Head Squirrel said nothing, which is how you know.'}
];
const CLOSERS = [
  'FILE SEALED. DO NOT DISCUSS ABOVE FLOOR ZERO.',
  'EYES ONLY. BURN AFTER READING. SAVE THE ACORNS.',
  'ARCHIVED BY THE MINISTRY OF SQUIRREL GROUP.',
  'NEXT BRIEFING: 0600. BRING YOUR OWN CHEEK POUCHES.'
];

function dayKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function buildMission(key) {
  const r = rng(hashStr('msg|' + key));
  const threat = pick(r, THREATS);
  const floor = -ri(r, 3, 99);
  const sector = pick(r, SECTORS);
  const squadA = pick(r, SQUADS);
  let squadB = pick(r, SQUADS); if (squadB === squadA) squadB = SQUADS[(SQUADS.indexOf(squadA)+3) % SQUADS.length];
  const weapon = pick(r, WEAPONS);
  const verb = pick(r, ORDER_VERBS);
  const outcome = pick(r, OUTCOMES);
  const closer = pick(r, CLOSERS);
  const fileNo = 'MSG-' + key.replace(/-/g,'') + '-' + String(ri(r, 100, 999));
  const soldiers = ri(r, 12, 400);
  const rounds = ri(r, 4, 40);
  return {
    key, fileNo, threat, floor, sector, squadA, squadB, weapon, verb, outcome, closer, soldiers, rounds,
    alarm: 'DANGER ON FLOOR ' + floor + '. ' + threat.n + ' INVASION!',
    order: COMMANDER + ': "SQUAD ' + squadA + ', SQUAD ' + squadB + ' — ' + weapon + ' UP. ' + verb + '!"'
  };
}

// ── 장면(샷) 구성 ────────────────────────────────────────────
//  각 샷은 SVG 한 장 + 자막 한 줄. 타임라인이 자동으로 넘긴다 = 영상.
function shots(m) {
  return [
    {ms:2600, cap:'M.S.G. HQ — SUB-BASEMENT. 0451 HOURS.',            draw:sHQ},
    {ms:3000, cap:m.alarm,                                                 draw:sAlarm},
    {ms:3600, cap:m.order,                                                 draw:sOrder},
    {ms:3000, cap:'SQUAD ' + m.squadA + ' AND SQUAD ' + m.squadB + ' DEPLOY. ' + m.soldiers + ' SOLDIER SQUIRRELS.', draw:sDeploy},
    {ms:3000, cap:'CONTACT AT ' + m.sector + '. ' + m.threat.n + ' — ' + m.threat.d + '.', draw:sThreat},
    {ms:3400, cap:m.weapon + ' FIRING. ' + m.rounds + ' ROUNDS AWAY.',      draw:sFire},
    {ms:3000, cap:m.outcome.t + '. ' + m.outcome.s,                        draw:sVictory},
    {ms:3600, cap:m.closer,                                                draw:sSeal}
  ];
}

// ── 그림 조각 ────────────────────────────────────────────────
function squirrel(x, y, s, opts) {
  opts = opts || {};
  const c = opts.helmet ? '#4a6b3f' : '#7a4a24';
  const anim = opts.anim ? ' style="animation:' + opts.anim + '"' : '';
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"' + anim + '>' +
    '<path d="M18 4 C34 6 40 26 26 34 C22 22 18 16 12 14 Z" fill="' + c + '" opacity=".85" style="transform-origin:14px 20px;animation:sway 1.6s ease-in-out infinite"/>' +
    '<ellipse cx="8" cy="26" rx="10" ry="11" fill="' + c + '"/>' +
    '<circle cx="6" cy="12" r="8" fill="' + c + '"/>' +
    '<circle cx="1" cy="6" r="3" fill="' + c + '"/><circle cx="11" cy="6" r="3" fill="' + c + '"/>' +
    '<circle cx="3" cy="12" r="1.6" fill="#111"/><circle cx="10" cy="12" r="1.6" fill="#111"/>' +
    (opts.helmet ? '<path d="M-3 9 A9 9 0 0 1 15 9 L15 6 A9 9 0 0 0 -3 6 Z" fill="#3d5a33"/>' : '') +
    (opts.cap ? '<path d="M-4 8 L16 8 L14 2 L-2 2 Z" fill="#233' + '' + '" opacity=".9"/><rect x="-8" y="7" width="12" height="3" rx="1.5" fill="#22303c"/>' : '') +
    (opts.bazooka ? '<rect x="8" y="20" width="34" height="7" rx="3" fill="#39424c"/><rect x="38" y="18" width="8" height="11" rx="2" fill="#2b333b"/>' : '') +
  '</g>';
}
function room(extra) {
  return '<rect width="640" height="360" fill="#12161b"/>' +
    '<rect y="250" width="640" height="110" fill="#1b2229"/>' +
    '<g opacity=".16" stroke="#7fd4ff" stroke-width="1">' +
      '<path d="M0 290H640M0 320H640M120 250V360M300 250V360M480 250V360"/></g>' + (extra || '');
}
function stars() {
  let s = '';
  for (let i=0;i<26;i++) s += '<circle cx="' + ((i*97)%630+5) + '" cy="' + ((i*53)%200+10) + '" r="1.4" fill="#9fb4c8" opacity=".5"/>';
  return s;
}
function sHQ(m) {
  return room('<rect x="60" y="60" width="240" height="120" rx="6" fill="#0e1418" stroke="#2c3b47"/>' +
    '<text x="76" y="92" class="mono" font-size="13" fill="#5fd08a">M.S.G. CENTRAL</text>' +
    '<text x="76" y="116" class="mono" font-size="11" fill="#3f8f63">FLOOR 0 .. FLOOR -99</text>' +
    '<text x="76" y="140" class="mono" font-size="11" fill="#3f8f63">STATUS: QUIET</text>' +
    '<circle cx="284" cy="86" r="6" fill="#5fd08a" style="animation:blink 1.4s infinite"/>' +
    squirrel(430, 190, 2.1, {cap:1}) +
    '<text x="404" y="330" class="mono" font-size="12" fill="#8aa0b4">' + COMMANDER + '</text>');
}
function sAlarm(m) {
  return '<g style="animation:shake .28s infinite">' + room(
    '<rect width="640" height="360" fill="#c02a1e" opacity=".22" style="animation:blink .7s infinite"/>' +
    '<text x="320" y="120" text-anchor="middle" class="mono" font-size="30" fill="#ff5a49">ALARM</text>' +
    '<text x="320" y="158" text-anchor="middle" class="mono" font-size="16" fill="#ffb3a8">FLOOR ' + m.floor + '</text>' +
    squirrel(300, 200, 2.1, {cap:1, anim:'bob .5s infinite'})) + '</g>';
}
function sOrder(m) {
  return room(squirrel(70, 150, 2.6, {cap:1}) +
    '<rect x="250" y="70" width="350" height="120" rx="10" fill="#0e1418" stroke="#5fd08a"/>' +
    '<text x="270" y="104" class="mono" font-size="14" fill="#5fd08a">ORDER ' + m.fileNo + '</text>' +
    '<text x="270" y="134" class="mono" font-size="13" fill="#cfe6d9">' + m.verb + '</text>' +
    '<text x="270" y="160" class="mono" font-size="12" fill="#8aa0b4">' + m.weapon + ' — SECTOR: ' + m.sector + '</text>' +
    '<circle cx="580" cy="98" r="6" fill="#ff5a49" style="animation:blink .8s infinite"/>');
}
function sDeploy(m) {
  let g = '';
  for (let i=0;i<6;i++) g += '<g style="animation:flyR ' + (2.2 + i*0.18) + 's linear infinite">' +
    squirrel(-60 + i*40, 170 + (i%3)*40, 1.5, {helmet:1, bazooka:1}) + '</g>';
  return room('<text x="320" y="60" text-anchor="middle" class="mono" font-size="15" fill="#5fd08a">DEPLOYING — ' + m.squadA + ' / ' + m.squadB + '</text>' + g);
}
function monster(kind) {
  if (kind === 'kaiju') return '<g transform="translate(400,90)" style="animation:stomp 1.1s ease-in-out infinite">' +
    '<path d="M40 40 C10 40 0 90 0 170 L120 170 C120 90 110 40 80 40 Z" fill="#2f5d3f"/>' +
    '<circle cx="60" cy="30" r="34" fill="#356b48"/>' +
    '<circle cx="46" cy="24" r="5" fill="#ffdc4a"/><circle cx="74" cy="24" r="5" fill="#ffdc4a"/>' +
    '<path d="M40 44 L52 54 L64 44 L76 54 L84 44" stroke="#e9f2ec" stroke-width="4" fill="none"/>' +
    '<path d="M60 -6 L70 -34 L80 -6 M20 60 L-16 96 M100 60 L136 96" stroke="#2f5d3f" stroke-width="10" fill="none"/></g>';
  if (kind === 'bird') return '<g transform="translate(420,80)" style="animation:bob 1s infinite">' +
    '<ellipse cx="60" cy="90" rx="56" ry="44" fill="#1d2530"/><circle cx="30" cy="52" r="22" fill="#232c38"/>' +
    '<path d="M10 50 L-20 58 L12 64 Z" fill="#e0b33a"/><circle cx="26" cy="46" r="4" fill="#ffdc4a"/>' +
    '<path d="M70 60 L150 30 L110 96 Z" fill="#141a22"/></g>';
  if (kind === 'cat') return '<g transform="translate(410,110)" style="animation:stomp 1.4s infinite">' +
    '<ellipse cx="70" cy="110" rx="76" ry="46" fill="#38312b"/><circle cx="26" cy="70" r="34" fill="#3f382f"/>' +
    '<path d="M4 46 L8 16 L30 40 Z M48 40 L64 14 L64 46 Z" fill="#3f382f"/>' +
    '<circle cx="16" cy="68" r="5" fill="#9ff05a"/><circle cx="38" cy="68" r="5" fill="#9ff05a"/></g>';
  if (kind === 'cloud') return '<g transform="translate(380,60)" style="animation:bob 1.8s infinite">' +
    '<circle cx="60" cy="90" r="52" fill="#4b5560" opacity=".9"/><circle cx="130" cy="104" r="44" fill="#3f4954" opacity=".9"/>' +
    '<circle cx="98" cy="60" r="40" fill="#59636f" opacity=".9"/><circle cx="176" cy="128" r="30" fill="#39424c" opacity=".9"/></g>';
  let g = ''; // horde
  for (let i=0;i<9;i++) g += '<g transform="translate(' + (360 + (i%3)*70) + ',' + (110 + Math.floor(i/3)*58) + ')" style="animation:bob ' + (0.7+i*0.09) + 's infinite">' +
    '<ellipse cx="0" cy="0" rx="26" ry="20" fill="#5a3350"/><circle cx="-14" cy="-10" r="4" fill="#ff7ad9"/><circle cx="6" cy="-10" r="4" fill="#ff7ad9"/></g>';
  return g;
}
function sThreat(m) {
  return room(stars() + monster(m.threat.kind) +
    '<text x="40" y="60" class="mono" font-size="20" fill="#ff5a49">' + m.threat.n + '</text>' +
    '<text x="40" y="84" class="mono" font-size="12" fill="#ffb3a8">HOSTILE — FLOOR ' + m.floor + '</text>' +
    squirrel(50, 250, 1.7, {helmet:1, bazooka:1}));
}
function sFire(m) {
  let shells = '';
  for (let i=0;i<5;i++) shells += '<g style="animation:flyR ' + (0.7 + i*0.13) + 's linear infinite">' +
    '<circle cx="' + (120 + i*10) + '" cy="' + (200 + (i%3)*40) + '" r="6" fill="#ffdc4a"/></g>';
  let booms = '';
  for (let i=0;i<3;i++) booms += '<g style="animation:boom ' + (0.8 + i*0.2) + 's infinite">' +
    '<circle cx="' + (440 + i*40) + '" cy="' + (120 + i*50) + '" r="34" fill="#ff8a3c" opacity=".85"/>' +
    '<circle cx="' + (440 + i*40) + '" cy="' + (120 + i*50) + '" r="18" fill="#ffe27a"/></g>';
  return '<g style="animation:shake .2s infinite">' + room(stars() + monster(m.threat.kind) +
    squirrel(30, 190, 1.7, {helmet:1, bazooka:1, anim:'bob .35s infinite'}) +
    squirrel(30, 265, 1.7, {helmet:1, bazooka:1, anim:'bob .45s infinite'}) +
    shells + booms +
    '<text x="40" y="52" class="mono" font-size="16" fill="#ffdc4a">FIRE! FIRE! FIRE!</text>') + '</g>';
}
function sVictory(m) {
  let g = '';
  for (let i=0;i<5;i++) g += squirrel(70 + i*100, 210, 1.8, {helmet:1, anim:'bob ' + (0.6+i*0.1) + 's infinite'});
  return room('<rect width="640" height="360" fill="#5fd08a" opacity=".08"/>' + g +
    '<text x="320" y="80" text-anchor="middle" class="mono" font-size="24" fill="#5fd08a">' + m.outcome.t + '</text>' +
    '<text x="320" y="110" text-anchor="middle" class="mono" font-size="12" fill="#cfe6d9">' + m.outcome.s + '</text>');
}
function sSeal(m) {
  return room('<rect x="90" y="60" width="460" height="230" rx="8" fill="#efe7d2"/>' +
    '<text x="120" y="106" class="mono" font-size="16" fill="#2b2b2b">FILE ' + m.fileNo + '</text>' +
    '<text x="120" y="138" class="mono" font-size="12" fill="#4a4a4a">SECTOR ' + m.sector + ' — FLOOR ' + m.floor + '</text>' +
    '<text x="120" y="162" class="mono" font-size="12" fill="#4a4a4a">THREAT ' + m.threat.n + '</text>' +
    '<text x="120" y="186" class="mono" font-size="12" fill="#4a4a4a">SQUADS ' + m.squadA + ' / ' + m.squadB + '</text>' +
    '<text x="120" y="210" class="mono" font-size="12" fill="#4a4a4a">RESULT ' + m.outcome.t + '</text>' +
    '<g transform="translate(410,214)" style="animation:stampIn .6s ease-out both">' +
      '<rect x="-84" y="-30" width="168" height="60" rx="4" fill="none" stroke="#b3271c" stroke-width="4"/>' +
      '<text x="0" y="10" text-anchor="middle" class="mono" font-size="24" fill="#b3271c">CLASSIFIED</text></g>');
}

// ── 재생기 ───────────────────────────────────────────────────
const app = document.getElementById('app');
let state = { mission:null, i:0, timer:null, playing:false };

function css(){ return `
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 60px}
  .badge{display:inline-block;border:2px solid #b3271c;color:#ff6a5a;padding:3px 10px;border-radius:3px;font-size:12px;letter-spacing:.14em}
  h1{font-size:26px;letter-spacing:.06em;margin:14px 0 2px}
  .sub{color:#8aa0b4;font-size:13px;margin:0 0 16px}
  .screen{position:relative;border:1px solid #2c3b47;border-radius:10px;overflow:hidden;background:#12161b}
  .screen svg{display:block;width:100%;height:auto}
  .scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(127,212,255,.07),transparent);height:18px;animation:scan 5s linear infinite}
  .cap{min-height:66px;padding:12px 14px;font-size:14px;line-height:1.5;color:#dfe9f0;border:1px solid #2c3b47;border-top:none;border-radius:0 0 10px 10px;background:#0e1318;animation:fadeUp .3s ease both}
  .bar{height:4px;background:#20272f;border-radius:2px;overflow:hidden;margin:12px 0}
  .bar i{display:block;height:100%;background:#5fd08a;width:0;transition:width .25s linear}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  button{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.08em;padding:10px 14px;border-radius:6px;border:1px solid #35505f;background:#182028;color:#cfe6d9;cursor:pointer}
  button.p{background:#5fd08a;color:#0d1a12;border-color:#5fd08a;font-weight:700}
  .meta{margin-top:18px;border:1px dashed #35505f;border-radius:8px;padding:12px 14px;font-size:12px;color:#8aa0b4;line-height:1.8}
  .meta b{color:#cfe6d9;font-weight:400}
`; }

function render() {
  const m = state.mission, sh = shots(m), s = sh[state.i];
  app.innerHTML = '<style>' + css() + '</style><div class="wrap">' +
    '<span class="badge mono">CLASSIFIED</span>' +
    '<h1 class="mono">M.S.G. FILES</h1>' +
    '<p class="sub mono">MINISTRY OF SQUIRREL GROUP — DAILY OPERATION ' + m.fileNo + '</p>' +
    '<div class="screen"><svg viewBox="0 0 640 360">' + s.draw(m) + '</svg><div class="scan"></div></div>' +
    '<div class="cap mono" id="cap">' + s.cap + '</div>' +
    '<div class="bar"><i id="bar" style="width:' + Math.round((state.i+1)/sh.length*100) + '%"></i></div>' +
    '<div class="row">' +
      '<button class="p tapbtn" id="play">' + (state.playing ? '‖ PAUSE' : (state.i >= sh.length-1 ? '↺ REPLAY' : '▶ PLAY')) + '</button>' +
      '<button class="tapbtn" id="prev">◀ PREV</button>' +
      '<button class="tapbtn" id="next">NEXT ▶</button>' +
      '<button class="tapbtn" id="arch">▤ ARCHIVE</button>' +
    '</div>' +
    '<div class="meta mono">SHOT <b>' + (state.i+1) + '/' + sh.length + '</b> · DATE <b>' + m.key + '</b><br>' +
      'FLOOR <b>' + m.floor + '</b> · SECTOR <b>' + m.sector + '</b> · THREAT <b>' + m.threat.n + '</b><br>' +
      'SQUADS <b>' + m.squadA + ' / ' + m.squadB + '</b> · ARMS <b>' + m.weapon + '</b> · STRENGTH <b>' + m.soldiers + '</b></div>' +
  '</div>';
  document.getElementById('play').onclick = () => state.playing ? pause() : play();
  document.getElementById('prev').onclick = () => { pause(); go(state.i - 1); };
  document.getElementById('next').onclick = () => { pause(); go(state.i + 1); };
  document.getElementById('arch').onclick = archive;
}
function go(i) {
  const n = shots(state.mission).length;
  state.i = Math.max(0, Math.min(n - 1, i));
  if (state.i === n - 1) remember();
  render();
}
function play() {
  const sh = shots(state.mission);
  if (state.i >= sh.length - 1) state.i = 0;
  state.playing = true; render(); tick();
}
function tick() {
  clearTimeout(state.timer);
  const sh = shots(state.mission);
  state.timer = setTimeout(() => {
    if (!state.playing) return;
    if (state.i >= sh.length - 1) { state.playing = false; render(); remember(); return; }
    state.i++; render(); tick();
  }, sh[state.i].ms);
}
function pause() { state.playing = false; clearTimeout(state.timer); render(); }

function loadLog() { try { return JSON.parse(localStorage.getItem(K_STORE)) || []; } catch (e) { return []; } }
function remember() {
  const m = state.mission, log = loadLog();
  if (!log.some(x => x.key === m.key)) {
    log.unshift({ key:m.key, fileNo:m.fileNo, threat:m.threat.n, floor:m.floor, result:m.outcome.t });
    try { localStorage.setItem(K_STORE, JSON.stringify(log.slice(0, 60))); } catch (e) {}
  }
}
function archive() {
  pause();
  const log = loadLog();
  const rows = log.length
    ? log.map(x => '<div style="padding:8px 0;border-bottom:1px solid #222c35">' + x.key + ' · ' + x.fileNo +
        '<br><span style="color:#8aa0b4">FLOOR ' + x.floor + ' · ' + x.threat + ' · ' + x.result + '</span></div>').join('')
    : '<p style="color:#8aa0b4">NO FILES ON RECORD. WATCH TODAY’S OPERATION TO THE END.</p>';
  app.innerHTML = '<style>' + css() + '</style><div class="wrap">' +
    '<span class="badge mono">CLASSIFIED</span><h1 class="mono">ARCHIVE</h1>' +
    '<p class="sub mono">OPERATIONS ON RECORD: ' + log.length + '</p>' +
    '<div class="meta mono">' + rows + '</div>' +
    '<div class="row"><button class="p tapbtn" id="back">◀ BACK TO FILE</button></div></div>';
  document.getElementById('back').onclick = () => render();
}

state.mission = buildMission(dayKey(new Date()));
render();
</script>
</body>
