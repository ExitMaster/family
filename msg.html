<style>
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; min-height:100%; }
body { font-family:'Inter',system-ui,sans-serif; background:#14161a; color:#e8e4d8; }
.mono { font-family:'Share Tech Mono',ui-monospace,monospace; }
::-webkit-scrollbar { width:0; height:0; }
@keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.15} }
@keyframes bob     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes sway    { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
@keyframes stomp   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px) } }
@keyframes shake   { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)} 75%{transform:translate(3px,-2px)} }
@keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes stampIn { 0%{opacity:0;transform:scale(2.4) rotate(-18deg)} 60%{opacity:1;transform:scale(.94) rotate(-11deg)} 100%{transform:scale(1) rotate(-11deg)} }
@keyframes scan    { from{transform:translateY(-100%)} to{transform:translateY(1400%)} }
@keyframes flyR    { from{transform:translateX(0)} to{transform:translateX(360px)} }
@keyframes boom    { 0%{opacity:0;transform:scale(.2)} 30%{opacity:1;transform:scale(1.15)} 100%{opacity:0;transform:scale(1.5)} }
.tapbtn:active { transform:scale(.95); }

<body class="notranslate">
<div id="app"></div>
<script>
// ── M.S.G. FILES (CLASSIFIED) ─────────────────────────────────────────────
//  Ministry of Squirrel Group. 하루 한 편, 날짜를 씨앗으로 삼는 결정론적 작전 영상.
//  같은 날짜 = 누가 열어도 똑같은 파일.
const K_STORE = 'family-msg-files-v1';
const K_UNLOCK = 'family-msg-unlocked';
const PIN = '1706';   // 기밀 접근 코드. 놀이용 잠금 — 진짜 보안이 아니다.

// ── 씨앗 난수 (mulberry32) ───────────────────────────────────
function hashStr(s) {
  let h = 2166136261;
  for (let i=0; i<s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const ri   = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));

// ── 작전 재료 ────────────────────────────────────────────────
const COMMANDER = 'HEAD SQUIRREL';
const THREATS = [
  {n:'KAIDU',        d:'a horde that chews through concrete', kind:'horde'},
  {n:'GODZILLA',     d:'thirty metres of very bad mood',      kind:'kaiju'},
  {n:'THE MAGPIE KING', d:'steals first, explains never',     kind:'bird'},
  {n:'MOLE ARMOUR DIV.', d:'comes up from underneath',        kind:'horde'},
  {n:'ACORN BLIGHT',  d:'turns a whole store to dust',        kind:'cloud'},
  {n:'THE VACUUM',    d:'human machine, no negotiation',      kind:'kaiju'},
  {n:'CAT UNIT NINE', d:'silent until it is far too late',    kind:'cat'},
  {n:'THE SNOW WALL', d:'moving south at walking pace',       kind:'cloud'}
];
const SQUADS = ['ACORN', 'PINE', 'THUNDER', 'HOLLOW', 'IRON TAIL', 'BIRCH', 'EMBER', 'FOG'];
const WEAPONS = ['BAZOOKAS', 'NUT MORTARS', 'PINECONE ROCKETS', 'TAIL-SPIN BLADES', 'ACORN ARTILLERY', 'SHELL LAUNCHERS'];
const SECTORS = ['THE OLD MAILBOX', 'BIRCH STAND', 'STEPPING STONES', 'OAKRIDGE HILL', 'THE FIR HOLLOW', 'CITY PARK BENCH', 'LIGHTHOUSE YARD', 'THE FALLEN WALL'];
const ORDER_VERBS = [
  'HOLD THE LINE', 'PUSH THEM BACK', 'DO NOT LET IT REACH THE STORE',
  'FIRE ON MY MARK', 'EVACUATE THE PUPS FIRST', 'TAKE THE HIGH BRANCH'
];
const OUTCOMES = [
  {t:'THREAT NEUTRALISED',    s:'All squads home. Two tails singed.'},
  {t:'THREAT DRIVEN OFF',     s:'It went east. It will be back.'},
  {t:'STORE HELD',            s:'Not one acorn lost. That is the whole report.'},
  {t:'TACTICAL WITHDRAWAL',   s:'The floor is gone. Everyone is not.'},
  {t:'THREAT NEUTRALISED',    s:'The Head Squirrel said nothing, which is how you know.'}
];
const CLOSERS = [
  'FILE SEALED. DO NOT DISCUSS ABOVE FLOOR ZERO.',
  'EYES ONLY. BURN AFTER READING. SAVE THE ACORNS.',
  'ARCHIVED BY THE MINISTRY OF SQUIRREL GROUP.',
  'NEXT BRIEFING: 0600. BRING YOUR OWN CHEEK POUCHES.'
];

function dayKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function buildMission(key) {
  const r = rng(hashStr('msg|' + key));
  const threat = pick(r, THREATS);
  const floor = -ri(r, 3, 99);
  const sector = pick(r, SECTORS);
  const squadA = pick(r, SQUADS);
  let squadB = pick(r, SQUADS); if (squadB === squadA) squadB = SQUADS[(SQUADS.indexOf(squadA)+3) % SQUADS.length];
  const weapon = pick(r, WEAPONS);
  const verb = pick(r, ORDER_VERBS);
  const outcome = pick(r, OUTCOMES);
  const closer = pick(r, CLOSERS);
  const fileNo = 'MSG-' + key.replace(/-/g,'') + '-' + String(ri(r, 100, 999));
  const soldiers = ri(r, 12, 400);
  const rounds = ri(r, 4, 40);
  return {
    key, fileNo, threat, floor, sector, squadA, squadB, weapon, verb, outcome, closer, soldiers, rounds,
    alarm: 'DANGER ON FLOOR ' + floor + '. ' + threat.n + ' INVASION!',
    order: COMMANDER + ': "Right then. Squad ' + squadA + ', Squad ' + squadB + ' — ' + weapon.toLowerCase() + ' up, if you please. ' + verb + '!"',
    orderSpoken: 'Right then. Squad ' + squadA + ' and Squad ' + squadB + '. ' + weapon.toLowerCase() + ' up, if you please. ' + verb + '!'
  };
}

// ── 장면(샷) 구성 ────────────────────────────────────────────
//  각 샷은 SVG 한 장 + 자막 한 줄. 타임라인이 자동으로 넘긴다 = 영상.
function shots(m) {
  if (state.mode === 'jr') return jrShots(m);
  return [
    {sfx:'hq',     ms:3200, cap:'도시는 아직 잠들어 있다. 04시 50분.',                    draw:sSkyline},
    {sfx:'hq',     ms:3000, cap:'M.S.G. HQ — SUB-BASEMENT. 0451 HOURS.',                  draw:sHQ},
    {sfx:'hq',     ms:3000, cap:'출동 전 식사. 도토리 하나씩, 말없이.',                   draw:sMess},
    {sfx:'alarm',  ms:3400, cap:m.alarm,                                                  draw:sAlarm},
    {sfx:'hq',     ms:3400, cap:'작전실 — ' + m.sector + ' 에 붉은 표시가 찍혔다.',       draw:sMapRoom},
    {sfx:'order',  ms:4200, cap:m.order,                                                  draw:sOrder},
    {sfx:'deploy', ms:3400, cap:'무장고 개방. ' + m.weapon + ' 지급.',                    draw:sArmory},
    {sfx:'deploy', ms:3200, cap:'승강기 하강 — 목표 층 ' + m.floor + '.',                 draw:sElevator},
    {sfx:'deploy', ms:3400, cap:'SQUAD ' + m.squadA + ' AND SQUAD ' + m.squadB + ' DEPLOY. ' + m.soldiers + ' SOLDIER SQUIRRELS.', draw:sDeploy},
    {sfx:'hq',     ms:3200, cap:'서비스 갱도 통과. 발소리를 줄인다.',                     draw:sTunnel},
    {sfx:'hq',     ms:3200, cap:'정찰대 보고 — ' + m.sector + ' 방향에서 접촉.',          draw:sRecon},
    {sfx:'order',  ms:3400, cap:'HEAD SQUIRREL: "Pups out first. Every one of them."',    draw:sEvacuate},
    {sfx:'threat', ms:3400, cap:'CONTACT AT ' + m.sector + '. ' + m.threat.n + ' — ' + m.threat.d + '.', draw:sThreat},
    {sfx:'fire',   ms:3600, cap:'1차 사격. ' + m.weapon + ' — ' + m.rounds + ' ROUNDS AWAY.', draw:sFire},
    {sfx:'threat', ms:3400, cap:m.threat.n + ' 반격! 3층까지 무너졌다. 대피!',            draw:sCounter},
    {sfx:'hq',     ms:3200, cap:'부상병 후송. 꼬리 그을림 둘, 걸을 수 있다.',             draw:sMedic},
    {sfx:'deploy', ms:3200, cap:'탄약 재보급 — 상자 넷.',                                 draw:sAmmo},
    {sfx:'deploy', ms:3200, cap:'HEAD SQUIRREL: "Send in the second wave. Steady, chaps."', draw:sReinforce},
    {sfx:'threat', ms:3200, cap:'연막 전개. 적도 우리를 못 본다.',                        draw:sSmoke},
    {sfx:'fire',   ms:3400, cap:'야간 교전 — 예광탄으로 방향만 잡는다.',                  draw:sNight},
    {sfx:'fire',   ms:3600, cap:'전 부대 일제 사격. 좌표 ' + Math.abs(m.floor) + '-' + m.rounds + '.', draw:sFire},
    {sfx:'stamp',  ms:3400, cap:'최후의 일격 — 명중!',                                    draw:sFinal},
    {sfx:'win',    ms:3400, cap:m.outcome.t + '. ' + m.outcome.s,                          draw:sVictory},
    {sfx:'hq',     ms:3200, cap:'잔해 수색. 남은 대원 없다 — 전원 확인.',                 draw:sSearch},
    {sfx:'hq',     ms:3200, cap:'도토리 창고 점검. 한 알도 없어지지 않았다.',             draw:sStoreCheck},
    {sfx:'win',    ms:3200, cap:'귀환 행진.',                                             draw:sMarch},
    {sfx:'win',    ms:3400, cap:'훈장 수여식.',                                           draw:sMedal},
    {sfx:'order',  ms:4000, cap:'대장3의 훈시 — "Floor ' + m.floor + ' holds. That is all that matters."', draw:sSpeech},
    {sfx:'stamp',  ms:3800, cap:m.closer,                                                  draw:sSeal}
  ];
}
// 주니어 작전 — 형 몰래 나갔다가 사고 치고, 형아 부대가 구하러 온다.
function jrShots(m) {
  return [
    {sfx:'hq',     ms:3000, cap:'04:30 — 주니어는 벌써 깨어 있다.',                        draw:jWake},
    {sfx:'hq',     ms:3000, cap:'하람쥐 주니어, 형 몰래 출동.',                            draw:jSneak},
    {sfx:'deploy', ms:3000, cap:'정문 통과. 아무도 안 본다. 아마도.',                      draw:jGate},
    {sfx:'deploy', ms:3200, cap:'도토리 흔적 발견! 여섯 개. 주니어는 다 셀 수 있다.',      draw:jTrail},
    {sfx:'hq',     ms:3000, cap:'한 개만 먹어보기로 한다. 딱 한 개만.',                    draw:jSnack},
    {sfx:'threat', ms:3400, cap:'앗! ' + m.threat.n + ' 에게 들켰다!',                     draw:jOops},
    {sfx:'threat', ms:3200, cap:'상자 뒤에 숨는다. 숨도 참는다.',                          draw:jHide},
    {sfx:'order',  ms:3800, cap:'주니어: "형아! 형아 나와! 여기 ' + m.sector + '!"',       draw:jCall},
    {sfx:'deploy', ms:3400, cap:'HEAD SQUIRREL: "Hold on, little one. We are coming."',    draw:jRescue},
    {sfx:'fire',   ms:3400, cap:m.squadA + ' 부대 엄호 사격!',                             draw:sFire},
    {sfx:'deploy', ms:3200, cap:'형 등에 업혀 탈출!',                                      draw:jRide},
    {sfx:'win',    ms:3400, cap:'무사 귀환. 도토리도 하나 안 놓쳤다.',                     draw:jHome},
    {sfx:'order',  ms:3800, cap:'형아의 잔소리 — 그리고 "Good lad."',                     draw:jScold},
    {sfx:'stamp',  ms:3600, cap:'대장3: "Well done, little one. But ask me next time."',   draw:sSeal}
  ];
}

// ── 그림 조각 ────────────────────────────────────────────────
function squirrel(x, y, s, opts) {
  opts = opts || {};
  const c = opts.body || (opts.helmet ? '#4a6b3f' : '#7a4a24');   // body 를 주면 헬멧과 무관하게 같은 털색
  const anim = opts.anim ? ' style="animation:' + opts.anim + '"' : '';
  return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"' + anim + '>' +
    '<path d="M18 4 C34 6 40 26 26 34 C22 22 18 16 12 14 Z" fill="' + c + '" opacity=".85" style="transform-origin:14px 20px;animation:sway 1.6s ease-in-out infinite"/>' +
    '<ellipse cx="8" cy="26" rx="10" ry="11" fill="' + c + '"/>' +
    '<circle cx="6" cy="12" r="8" fill="' + c + '"/>' +
    '<circle cx="1" cy="6" r="3" fill="' + c + '"/><circle cx="11" cy="6" r="3" fill="' + c + '"/>' +
    '<circle cx="3" cy="12" r="1.6" fill="#111"/><circle cx="10" cy="12" r="1.6" fill="#111"/>' +
    (opts.helmet ? '<path d="M-3 9 A9 9 0 0 1 15 9 L15 6 A9 9 0 0 0 -3 6 Z" fill="#3d5a33"/>' : '') +
    (opts.cap ? '<path d="M-4 8 L16 8 L14 2 L-2 2 Z" fill="#233' + '' + '" opacity=".9"/><rect x="-8" y="7" width="12" height="3" rx="1.5" fill="#22303c"/>' : '') +
    (opts.bazooka ? '<rect x="8" y="20" width="34" height="7" rx="3" fill="#39424c"/><rect x="38" y="18" width="8" height="11" rx="2" fill="#2b333b"/>' : '') +
  '</g>';
}
function room(extra) {
  return '<rect width="640" height="360" fill="#12161b"/>' +
    '<rect y="250" width="640" height="110" fill="#1b2229"/>' +
    '<g opacity=".16" stroke="#7fd4ff" stroke-width="1">' +
      '<path d="M0 290H640M0 320H640M120 250V360M300 250V360M480 250V360"/></g>' + (extra || '');
}
function stars() {
  let s = '';
  for (let i=0;i<26;i++) s += '<circle cx="' + ((i*97)%630+5) + '" cy="' + ((i*53)%200+10) + '" r="1.4" fill="#9fb4c8" opacity=".5"/>';
  return s;
}
function sHQ(m) {
  return room('<rect x="60" y="60" width="240" height="120" rx="6" fill="#0e1418" stroke="#2c3b47"/>' +
    '<text x="76" y="92" class="mono" font-size="13" fill="#5fd08a">M.S.G. CENTRAL</text>' +
    '<text x="76" y="116" class="mono" font-size="11" fill="#3f8f63">FLOOR 0 .. FLOOR -99</text>' +
    '<text x="76" y="140" class="mono" font-size="11" fill="#3f8f63">STATUS: QUIET</text>' +
    '<circle cx="284" cy="86" r="6" fill="#5fd08a" style="animation:blink 1.4s infinite"/>' +
    squirrel(430, 190, 2.1, {cap:1}) +
    '<text x="404" y="330" class="mono" font-size="12" fill="#8aa0b4">' + COMMANDER + '</text>');
}
function sAlarm(m) {
  return '<g style="animation:shake .28s infinite">' + room(
    '<rect width="640" height="360" fill="#c02a1e" opacity=".22" style="animation:blink .7s infinite"/>' +
    '<text x="320" y="120" text-anchor="middle" class="mono" font-size="30" fill="#ff5a49">ALARM</text>' +
    '<text x="320" y="158" text-anchor="middle" class="mono" font-size="16" fill="#ffb3a8">FLOOR ' + m.floor + '</text>' +
    squirrel(300, 200, 2.1, {cap:1, anim:'bob .5s infinite'})) + '</g>';
}
function sOrder(m) {
  return room(squirrel(70, 150, 2.6, {cap:1}) +
    '<rect x="250" y="70" width="350" height="120" rx="10" fill="#0e1418" stroke="#5fd08a"/>' +
    '<text x="270" y="104" class="mono" font-size="14" fill="#5fd08a">ORDER ' + m.fileNo + '</text>' +
    '<text x="270" y="134" class="mono" font-size="13" fill="#cfe6d9">' + m.verb + '</text>' +
    '<text x="270" y="160" class="mono" font-size="12" fill="#8aa0b4">' + m.weapon + ' — SECTOR: ' + m.sector + '</text>' +
    '<circle cx="580" cy="98" r="6" fill="#ff5a49" style="animation:blink .8s infinite"/>');
}
function sDeploy(m) {
  let g = '';
  for (let i=0;i<6;i++) g += '<g style="animation:flyR ' + (2.2 + i*0.18) + 's linear infinite">' +
    squirrel(-60 + i*40, 170 + (i%3)*40, 1.5, {helmet:1, bazooka:1}) + '</g>';
  return room('<text x="320" y="60" text-anchor="middle" class="mono" font-size="15" fill="#5fd08a">DEPLOYING — ' + m.squadA + ' / ' + m.squadB + '</text>' + g);
}
function monster(kind) {
  if (kind === 'kaiju') return '<g transform="translate(400,90)" style="animation:stomp 1.1s ease-in-out infinite">' +
    '<path d="M40 40 C10 40 0 90 0 170 L120 170 C120 90 110 40 80 40 Z" fill="#2f5d3f"/>' +
    '<circle cx="60" cy="30" r="34" fill="#356b48"/>' +
    '<circle cx="46" cy="24" r="5" fill="#ffdc4a"/><circle cx="74" cy="24" r="5" fill="#ffdc4a"/>' +
    '<path d="M40 44 L52 54 L64 44 L76 54 L84 44" stroke="#e9f2ec" stroke-width="4" fill="none"/>' +
    '<path d="M60 -6 L70 -34 L80 -6 M20 60 L-16 96 M100 60 L136 96" stroke="#2f5d3f" stroke-width="10" fill="none"/></g>';
  if (kind === 'bird') return '<g transform="translate(420,80)" style="animation:bob 1s infinite">' +
    '<ellipse cx="60" cy="90" rx="56" ry="44" fill="#1d2530"/><circle cx="30" cy="52" r="22" fill="#232c38"/>' +
    '<path d="M10 50 L-20 58 L12 64 Z" fill="#e0b33a"/><circle cx="26" cy="46" r="4" fill="#ffdc4a"/>' +
    '<path d="M70 60 L150 30 L110 96 Z" fill="#141a22"/></g>';
  if (kind === 'cat') return '<g transform="translate(410,110)" style="animation:stomp 1.4s infinite">' +
    '<ellipse cx="70" cy="110" rx="76" ry="46" fill="#38312b"/><circle cx="26" cy="70" r="34" fill="#3f382f"/>' +
    '<path d="M4 46 L8 16 L30 40 Z M48 40 L64 14 L64 46 Z" fill="#3f382f"/>' +
    '<circle cx="16" cy="68" r="5" fill="#9ff05a"/><circle cx="38" cy="68" r="5" fill="#9ff05a"/></g>';
  if (kind === 'cloud') return '<g transform="translate(380,60)" style="animation:bob 1.8s infinite">' +
    '<circle cx="60" cy="90" r="52" fill="#4b5560" opacity=".9"/><circle cx="130" cy="104" r="44" fill="#3f4954" opacity=".9"/>' +
    '<circle cx="98" cy="60" r="40" fill="#59636f" opacity=".9"/><circle cx="176" cy="128" r="30" fill="#39424c" opacity=".9"/></g>';
  let g = ''; // horde
  for (let i=0;i<9;i++) g += '<g transform="translate(' + (360 + (i%3)*70) + ',' + (110 + Math.floor(i/3)*58) + ')" style="animation:bob ' + (0.7+i*0.09) + 's infinite">' +
    '<ellipse cx="0" cy="0" rx="26" ry="20" fill="#5a3350"/><circle cx="-14" cy="-10" r="4" fill="#ff7ad9"/><circle cx="6" cy="-10" r="4" fill="#ff7ad9"/></g>';
  return g;
}
function sThreat(m) {
  return room(stars() + monster(m.threat.kind) +
    '<text x="40" y="60" class="mono" font-size="20" fill="#ff5a49">' + m.threat.n + '</text>' +
    '<text x="40" y="84" class="mono" font-size="12" fill="#ffb3a8">HOSTILE — FLOOR ' + m.floor + '</text>' +
    squirrel(50, 250, 1.7, {helmet:1, bazooka:1}));
}
function sFire(m) {
  let shells = '';
  for (let i=0;i<5;i++) shells += '<g style="animation:flyR ' + (0.7 + i*0.13) + 's linear infinite">' +
    '<circle cx="' + (120 + i*10) + '" cy="' + (200 + (i%3)*40) + '" r="6" fill="#ffdc4a"/></g>';
  let booms = '';
  for (let i=0;i<3;i++) booms += '<g style="animation:boom ' + (0.8 + i*0.2) + 's infinite">' +
    '<circle cx="' + (440 + i*40) + '" cy="' + (120 + i*50) + '" r="34" fill="#ff8a3c" opacity=".85"/>' +
    '<circle cx="' + (440 + i*40) + '" cy="' + (120 + i*50) + '" r="18" fill="#ffe27a"/></g>';
  return '<g style="animation:shake .2s infinite">' + room(stars() + monster(m.threat.kind) +
    squirrel(30, 190, 1.7, {helmet:1, bazooka:1, anim:'bob .35s infinite'}) +
    squirrel(30, 265, 1.7, {helmet:1, bazooka:1, anim:'bob .45s infinite'}) +
    shells + booms +
    '<text x="40" y="52" class="mono" font-size="16" fill="#ffdc4a">FIRE! FIRE! FIRE!</text>') + '</g>';
}
function sVictory(m) {

// ── 효과음 (WebAudio 합성 — 음원 파일 없이, 오프라인에서도 난다) ─────────
const K_MUTE = 'family-msg-mute';
let AC = null;
let muted = (() => { try { return localStorage.getItem(K_MUTE) === '1'; } catch (e) { return false; } })();
function ac() {
  if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
// 기본 음 하나. type=파형, f0→f1 로 미끄러지며 dur 초 동안 감쇠.
function tone(f0, f1, dur, type, gain, delay) {
  const c = ac(); if (!c || muted) return;
  const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain || 0.16, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
// 노이즈 한 덩이. 폭발·발사음의 몸통.
function noise(dur, cut0, cut1, gain, delay) {
  const c = ac(); if (!c || muted) return;
  const t = c.currentTime + (delay || 0);
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(cut0, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(60, cut1), t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(gain || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t); src.stop(t + dur);
}

  key:    () => tone(660, 660, 0.05, 'square', 0.07),

  go:     () => { tone(392, 784, 0.35, 'square', 0.14); noise(0.5, 900, 200, 0.22, 0.1); },

// ── 스톱워치 ─────────────────────────────────────────────────
//  퀴즈를 통과한 순간 출발해서, 임무를 완수(영상 끝 + 체크리스트 전부)하면 멈춘다.
//  기록은 ARCHIVE 에 남는다.
function swMs() { return state.t0 ? ((state.tEnd || Date.now()) - state.t0) : 0; }
function swText(ms) {
  const t = Math.max(0, Math.floor(ms / 100));
  const m = Math.floor(t / 600), sec = Math.floor(t / 10) % 60, d = t % 10;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0') + '.' + d;
}
function swStart() {
  state.t0 = Date.now(); state.tEnd = 0; state.doneAt = 0;
  clearInterval(state.swTimer);
  state.swTimer = setInterval(() => {
    const el = document.getElementById('sw');
    if (el && !state.tEnd) el.textContent = swText(swMs());
  }, 100);
}
function swStop() { if (state.t0 && !state.tEnd) state.tEnd = Date.now(); clearInterval(state.swTimer); state.swTimer = null; }

// ── 임무 체크리스트 ──────────────────────────────────────────
//  작전을 보면서 하나씩 눌러 확인한다. 전부 확인 + 영상 끝 = 임무 완수.

    { t: m.squadA + ' / ' + m.squadB + ' 출동 확인', done: false },

  ];

function taskDone() { return (state.tasks || []).filter(t => t.done).length; }
function missionComplete() { return state.reelDone && state.tasks && taskDone() === state.tasks.length; }

  const t = state.tasks[i];

  if (!missionComplete() || state.doneAt) return false;

function toggleFull() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (document.body.classList.contains('fakefull')) { document.body.classList.remove('fakefull'); return; }
  const el = document.querySelector('.wrap') || document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) { document.body.classList.add('fakefull'); return; }
  try {
    const r = req.call(el);
    if (r && r.catch) r.catch(() => { document.body.classList.add('fakefull'); render(); });
  } catch (e) { document.body.classList.add('fakefull'); }
}

// ── 하람쥐 대장의 목소리 (영국식) ───────────────────────────
//  SpeechSynthesis 로 en-GB 음성을 골라 대장 대사만 읽는다.
//  en-GB 음성이 없는 기기에서는 조용히 넘어간다 — 자막은 그대로 영국식.
let VOICE = null, voiceTried = false;
function ukVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return null;
  return vs.find(v => /en[-_]GB/i.test(v.lang) && /daniel|arthur|male|george|oliver/i.test(v.name))
      || vs.find(v => /en[-_]GB/i.test(v.lang))
      || vs.find(v => /english.*(uk|british)/i.test(v.name))
      || null;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { VOICE = ukVoice(); };
function speak(text, jr) {
  if (muted || !window.speechSynthesis || !text) return;
  if (!voiceTried) { VOICE = ukVoice(); voiceTried = true; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    if (jr === undefined) jr = (state.mode === 'jr');
    u.rate = jr ? 1.08 : 0.95;
    u.pitch = jr ? 1.6 : 0.85;
    try { if (VOICE) u.voice = VOICE; } catch (e) {}
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }

function acornField(n, seed) {
  const r = rng(seed);
  let g = '', used = [];
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do { x = 40 + r() * 540; y = 40 + r() * 260; tries++; }
    while (tries < 40 && used.some(u => Math.abs(u[0]-x) < 62 && Math.abs(u[1]-y) < 62));
    used.push([x, y]);
    g += '<g transform="translate(' + Math.round(x) + ',' + Math.round(y) + ') rotate(' + Math.round(r()*40-20) + ')">' +
      '<ellipse cx="0" cy="6" rx="17" ry="20" fill="#c08a44"/>' +
      '<path d="M-18 -6 A18 13 0 0 1 18 -6 Z" fill="#7a4a24"/>' +
      '<rect x="-2.5" y="-16" width="5" height="8" rx="2" fill="#5c3618"/></g>';
  }
  return '<rect width="640" height="340" fill="#12161b"/>' + g;
}
// 4지선다 보기: 정답 + 가까운 오답들
function choicesAround(r, ans, spread, min) {
  const out = [ans];
  let guard = 0;
  while (out.length < 4 && guard++ < 60) {
    const v = ans + (Math.floor(r() * spread * 2) - spread);
    if (v >= (min === undefined ? 0 : min) && out.indexOf(v) < 0) out.push(v);
  }
  while (out.length < 4) out.push(Math.max(min || 0, ans + out.length));
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = out[i]; out[i] = out[j]; out[j] = t; }
  return out;
}

const QUIZ_KINDS = [

             opts: choicesAround(r, n, 3, 1), ans: n };
  }},
  // 창고 더하기 · 빼기
  { jr: true, make: function (r, m, jr) {
    const a = jr ? ri(r, 3, 9) : ri(r, 6, 20), b = jr ? ri(r, 1, 5) : ri(r, 3, 12), plus = jr ? true : r() < 0.55;
    const ans = plus ? a + b : Math.max(a, b) - Math.min(a, b);
    return {
      q: plus ? '창고에 도토리가 ' + a + '개. ' + b + '개를 더 모았다. 모두 몇 개?'

      art: acornField(Math.min(plus ? a : Math.max(a,b), 12), hashStr('calc|' + a + b)),
      opts: choicesAround(r, ans, 4, 0), ans: ans };
  }},
  // 두 창고 비교 — 차이 구하기
  { jr: true, make: function (r, m, jr) {
    const a = jr ? ri(r, 2, 7) : ri(r, 4, 12), b = jr ? ri(r, 2, 7) : ri(r, 4, 12);
    const hi = Math.max(a, b), lo = Math.min(a, b), ans = hi - lo;
    const pile = (n, x, seed) => {
      const rr = rng(seed); let g = '';
      for (let i = 0; i < n; i++) g += '<g transform="translate(' + Math.round(x + rr() * 200) + ',' + Math.round(70 + rr() * 190) + ')">' +

    return {
      q: 'A창고 ' + a + '개, B창고 ' + b + '개. 몇 개 차이가 날까?',
      art: '<rect width="640" height="340" fill="#12161b"/><line x1="320" y1="20" x2="320" y2="320" stroke="#2c3b47" stroke-width="2"/>' +
        '<text x="60" y="34" class="mono" font-size="14" fill="#5fd08a">A</text>' +
        '<text x="360" y="34" class="mono" font-size="14" fill="#5fd08a">B</text>' +
        pile(a, 40, hashStr('pa|' + a)) + pile(b, 340, hashStr('pb|' + b)),
      opts: choicesAround(r, ans, 3, 0), ans: ans };
  }},
  // 헬멧 센 마리 — 관찰
  { jr: true, make: function (r, m, jr) {
    const tot = jr ? ri(r, 4, 7) : ri(r, 6, 10), hel = ri(r, 2, tot - 1);
    let g = '', k = 0;
    for (let row = 0; row < 2; row++) for (let col = 0; col < Math.ceil(tot / 2); col++) {
      if (k >= tot) break;
      g += squirrel(40 + col * 100, 60 + row * 130, 1.5, { helmet: k < hel, body: '#7a4a24' });
      k++;
    }
    return { q: '헬멧을 쓴 다람쥐는 몇 마리?',
             art: '<rect width="640" height="340" fill="#12161b"/>' + g,
             opts: choicesAround(r, hel, 2, 1), ans: hel };
  }},
  // 부대 편성 — 곱하기
  { jr: false, make: function (r, m) {
    const sq = ri(r, 2, 5), per = ri(r, 3, 8), ans = sq * per;
    return {
      q: '부대 ' + sq + '개, 한 부대에 다람쥐 ' + per + '마리. 모두 몇 마리?',
      art: '<rect width="640" height="340" fill="#12161b"/>' +
        Array.from({length: sq}, (_, i) =>
          Array.from({length: per}, (_, j) => squirrel(50 + j * 70, 40 + i * 70, 1.2, {helmet:1})).join('')).join(''),
      opts: choicesAround(r, ans, 5, 1), ans: ans };
  }},
  // 나누기 — 도토리 똑같이 나누기
  { jr: false, make: function (r, m) {
    const per = ri(r, 2, 9), sq = ri(r, 2, 5), tot = per * sq;
    return {
      q: '도토리 ' + tot + '개를 부대 ' + sq + '개에 똑같이 나누면, 한 부대에 몇 개?',
      art: acornField(Math.min(tot, 14), hashStr('div|' + tot + sq)),
      opts: choicesAround(r, per, 3, 1), ans: per };
  }},
  // 다음 순서 — 뛰어 세기
  { jr: false, make: function (r, m) {
    const step = pick(r, [2, 3, 5, 10]), from = step * ri(r, 1, 4);
    const seq = [from, from + step, from + step * 2, from + step * 3], ans = from + step * 4;
    return {
      q: '다음에 올 숫자는? ' + seq.join(', ') + ', ?',
      art: '<rect width="640" height="340" fill="#12161b"/>' +
        seq.map((v, i) => '<g transform="translate(' + (60 + i * 120) + ',150)"><rect x="-42" y="-40" width="84" height="80" rx="10" fill="#0e1418" stroke="#2c3b47"/>' +
          '<text y="12" text-anchor="middle" class="mono" font-size="30" fill="#5fd08a">' + v + '</text></g>').join('') +
        '<g transform="translate(540,150)"><rect x="-42" y="-40" width="84" height="80" rx="10" fill="#0e1418" stroke="#ffdc4a"/>' +
        '<text y="12" text-anchor="middle" class="mono" font-size="30" fill="#ffdc4a">?</text></g>',
      opts: (() => { const o = [ans, ans + step, ans - step, ans + step * 2].map(v => Math.max(0, v));
        for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = o[i]; o[i] = o[j]; o[j] = t; }
        return o; })(), ans: ans };
  }},
  // 층 이동 계산
  { jr: false, make: function (r, m) {
    const from = Math.abs(m.floor), up = ri(r, 3, Math.max(4, from - 2)), ans = from - up;
    return {
      q: '지하 ' + from + '층에서 ' + up + '층 위로 올라가면 지하 몇 층?',
      art: '<rect width="640" height="340" fill="#12161b"/>' +
        Array.from({length: 6}, (_, i) => '<g><rect x="60" y="' + (30 + i * 50) + '" width="520" height="40" rx="6" fill="#1b2229" stroke="#2c3b47"/>' +
          '<text x="80" y="' + (57 + i * 50) + '" class="mono" font-size="14" fill="#8aa0b4">FLOOR -' + (from - (5 - i)) + '</text></g>').join('') +
        squirrel(470, 250, 1.6, {helmet:1}),
      opts: choicesAround(r, ans, 3, 0), ans: ans, prefix: '-' };
  }},
  // 대장 명령 듣기 — 영국식 발음으로 읽어주는 숫자
  { jr: false, voice: true, make: function (r, m) {
    const ans = ri(r, 11, 39);
    return {
      q: '🎧 대장3의 무전을 듣고 숫자를 고르라. (소리를 켜야 한다 — 다시 들으려면 화면을 누른다)',
      art: '<rect width="640" height="340" fill="#12161b"/>' +
        '<text x="320" y="120" text-anchor="middle" class="mono" font-size="26" fill="#5fd08a">📻 INCOMING</text>' +
        '<text x="320" y="164" text-anchor="middle" class="mono" font-size="13" fill="#8aa0b4">HEAD SQUIRREL — VOICE ONLY</text>' +
        squirrel(280, 200, 1.9, {cap:1}),
      opts: choicesAround(r, ans, 5, 1), ans: ans,
      say: 'Listen carefully, trooper. Send ' + ans + ' squirrels to the front. I repeat: ' + ans + '.' };
  }},
  // 브리핑 기억
  { jr: false, make: function (r, m) {
    const ans = Math.abs(m.floor);
    return {
      q: '오늘 작전은 지하 몇 층인가? (브리핑을 떠올려라)',
      art: '<rect width="640" height="340" fill="#12161b"/>' +
        '<text x="320" y="150" text-anchor="middle" class="mono" font-size="34" fill="#5fd08a">FLOOR ?</text>' +
        '<text x="320" y="196" text-anchor="middle" class="mono" font-size="15" fill="#8aa0b4">SECTOR ' + m.sector + '</text>' +
        squirrel(280, 210, 1.8, {cap:1}),
      opts: choicesAround(r, ans, 6, 1), ans: ans, prefix: '-' };
  }},
  // 적 이름 — 브리핑에서 본 오늘의 적 고르기
  { jr: true, make: function (r, m) {
    const others = THREATS.filter(t => t.n !== m.threat.n);
    const opts = [m.threat.n];
    while (opts.length < 4 && others.length) opts.push(others.splice(Math.floor(r() * others.length), 1)[0].n);
    for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
    return {
      q: '오늘 우리가 맞서는 적은?',
      art: '<rect width="640" height="340" fill="#12161b"/>' + stars() + monster(m.threat.kind) +
        '<text x="40" y="60" class="mono" font-size="20" fill="#ff5a49">???</text>' +
        squirrel(50, 230, 1.6, {helmet:1}),
      opts: opts, ans: m.threat.n, text: true };
  }}
];
function buildQuiz(m) {
  const r = rng(hashStr('quiz|' + m.key + '|' + (state.attempt || 0) + '|' + Math.floor(Math.random() * 1e9)));
  const jr = state.mode === 'jr';
  // 소리를 껐거나 음성이 없으면 듣기 문제는 뺀다.
  const pool = QUIZ_KINDS.filter(k => (jr ? k.jr : true) && !(k.voice && (muted || !window.speechSynthesis)));
  const out = [];
  while (out.length < quizN() && pool.length) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0].make(r, m, jr));
  return out;
}
function startQuiz() {
  if (state.lastMode !== state.mode) { state.attempt = 0; state.lastMode = state.mode; }  // 심사 횟수는 작전별로 센다
  state.attempt = (state.attempt || 0) + 1;
  state.quiz = buildQuiz(state.mission);
  state.qi = 0; state.qmsg = ''; state.qok = false; state.said = -1;
  renderQuiz();
}
function renderQuiz() {
  const q = state.quiz[state.qi];
  const dots = state.quiz.map((_, i) =>
    '<i class="' + (i < state.qi ? 'on' : '') + '">' + (i < state.qi ? '✓' : (i === state.qi ? '?' : '')) + '</i>').join('');
  app.innerHTML = '<style>' + css() + '</style><div class="wrap">' +
    '<span class="badge mono">CLASSIFIED</span>' +
    '<h1 class="mono">임무 자격 심사</h1>' +
    '<p class="sub mono">' + quizN() + '문제를 맞혀야 작전이 개시된다 — ' + (state.qi + 1) + ' / ' + quizN() + '</p>' +
    '<div class="screen"><svg viewBox="0 0 640 340">' + q.art + '</svg><div class="scan"></div></div>' +
    '<div class="cap mono">' + q.q + '</div>' +
    '<div class="pin">' + dots + '</div>' +
    '<div class="err mono" style="color:' + (state.qok ? '#5fd08a' : '#ff6a5a') + '">' + state.qmsg + '</div>' +
    '<div class="pad" style="grid-template-columns:repeat(2,1fr)">' +
      q.opts.map(o => '<button class="tapbtn mono" data-a="' + o + '">' + (q.prefix || '') + o + '</button>').join('') +
    '</div>' +
    '<div class="row" style="justify-content:center;margin-top:14px">' +
      '<button class="tapbtn mono" id="brief2">▣ 브리핑으로</button>' +
      '<button class="tapbtn mono" id="mute">' + muteLabel() + '</button>' +
    '</div>' +
  '</div>';
  app.querySelectorAll('.pad button').forEach(b => b.onclick = () => answer(q.text ? b.dataset.a : Number(b.dataset.a)));
  if (q.say) {
    const scr = app.querySelector('.screen');
    if (scr) scr.onclick = () => speak(q.say, false);
    if (state.said !== state.qi) { state.said = state.qi; setTimeout(() => speak(q.say, false), 350); }
  }
  document.getElementById('brief2').onclick = () => { state.quiz = null; renderBrief(); };
  document.getElementById('mute').onclick = () => { toggleMute(); renderQuiz(); };
}
function answer(v) {
  const q = state.quiz[state.qi];
  const r = rng(hashStr('msg' + v + state.qi + Date.now()));
  if (v !== q.ans) {
    state.qok = false; state.qmsg = pick(r, SCOLD);
    sfx('wrong'); speak(state.qmsg); renderQuiz(); return;
  }
  sfx('unlock');
  if (state.qi < state.quiz.length - 1) {
    state.qi++; state.said = -1; state.qok = true; state.qmsg = pick(r, PRAISE); speak(state.qmsg); renderQuiz(); return;
  }
  state.quiz = null; sfx('go');
  speak(state.mode === 'jr'
    ? 'Yay! All correct! Come on, come on, let us go!'
    : 'All correct. Very good indeed. M.S.G., you are cleared for the mission.');
  state.tasks = buildTasks(state.mission); state.reelDone = false;
  swStart();
  state.started = true; state.i = 0; state.cued = -1; play();
}

function renderBrief() {
  const m = state.mission;
  app.innerHTML = '<style>' + css() + '</style><div class="wrap">' +
    '<span class="badge mono">CLASSIFIED</span>' +
    '<h1 class="mono">M.S.G. FILES</h1>' +
    '<p class="sub mono">MINISTRY OF SQUIRREL GROUP — DAILY OPERATION ' + m.fileNo + '</p>' +
    '<div class="brief mono">' +
      '<h2>오늘의 임무 브리핑</h2>' +
      '<p>지점 <b style="color:#cfe6d9">' + m.sector + '</b> · 층 <b style="color:#cfe6d9">' + m.floor + '</b></p>' +
      '<p>적 <b style="color:#ff6a5a">' + m.threat.n + '</b> — ' + m.threat.d + '</p>' +
      '<p>부대 <b style="color:#cfe6d9">' + m.squadA + ' / ' + m.squadB + '</b> · 무장 <b style="color:#cfe6d9">' + m.weapon + '</b></p>' +
      '<button class="go tapbtn mono" id="go"><small>공군 하람쥐 대장3</small>임무 시작! 🚀</button>' +
      '<p style="margin-top:10px;text-align:center">자격 심사 ' + QUIZ_N + '문제 · 작전 15장면</p>' +
      '<button class="go jr tapbtn mono" id="gojr"><small>하람쥐 주니어</small>미션 시작! 🌰</button>' +
      '<p style="margin-top:8px;text-align:center">짧고 쉬운 작전. 문제 ' + QUIZ_N_JR + '개, 형아가 구하러 온다.</p>' +
    '</div>' +
    '<div class="row">' +
      '<button class="tapbtn mono" id="full">' + fsLabel() + '</button>' +
      '<button class="tapbtn mono" id="mute">' + muteLabel() + '</button>' +
      '<button class="tapbtn mono" id="arch">▤ ARCHIVE</button>' +
    '</div>' +
  '</div>';
  document.getElementById('go').onclick = () => { state.mode = 'main'; sfx('key'); startQuiz(); };
  document.getElementById('gojr').onclick = () => { state.mode = 'jr'; sfx('key'); startQuiz(); };
  document.getElementById('full').onclick = () => { toggleFull(); setTimeout(renderBrief, 120); };
  document.getElementById('mute').onclick = () => { toggleMute(); renderBrief(); };
  document.getElementById('arch').onclick = archive;
}

function render() {
  if (!unlocked()) return renderLock();
  if (state.quiz) return renderQuiz();
  if (!state.started) return renderBrief();
  const m = state.mission, sh = shots(m), s = sh[state.i];
  if (state.cued !== state.i) {
    state.cued = state.i; hush(); sfx(s.sfx);
    if (s.sfx === 'order') speak(m.orderSpoken);
    if (s.sfx === 'stamp') speak('File sealed. Well done, trooper. Same time tomorrow.');
  }
  app.innerHTML = '<style>' + css() + '</style><div class="wrap">' +
    '<span class="badge mono">CLASSIFIED</span>' +
    '<h1 class="mono">M.S.G. FILES</h1>' +
    '<p class="sub mono">' + (state.mode === 'jr' ? '주니어 작전' : 'MINISTRY OF SQUIRREL GROUP') + ' — ' + m.fileNo + '</p>' +
    '<div class="screen"><button class="fs tapbtn mono" id="full" title="전체화면">' + (fsOn() ? '⤡' : '⛶') + '</button>' +
      '<svg viewBox="0 0 640 360">' + s.draw(m) + '</svg><div class="scan"></div></div>' +
    '<div class="cap mono" id="cap">' + s.cap + '</div>' +
    '<div class="bar"><i id="bar" style="width:' + Math.round((state.i+1)/sh.length*100) + '%"></i></div>' +
    '<div class="swrow mono"><span class="swlab">임무 시간</span>' +
      '<span id="sw" class="' + (state.doneAt ? 'stopped' : '') + '">' + swText(swMs()) + '</span>' +
      '<span class="swlab">' + (state.doneAt ? '⏹ 정지' : '⏱ 측정 중') + '</span></div>' +
    '<div class="row">' +
      '<button class="p tapbtn" id="play">' + (state.playing ? '‖ PAUSE' : (state.i >= sh.length-1 ? '↺ REPLAY' : '▶ PLAY')) + '</button>' +
      '<button class="tapbtn" id="prev">◀ PREV</button>' +
      '<button class="tapbtn" id="next">NEXT ▶</button>' +
      '<button class="tapbtn" id="arch">▤ ARCHIVE</button>' +
      '<button class="tapbtn" id="brief">▣ 브리핑</button>' +
      '<button class="tapbtn" id="mute">' + muteLabel() + '</button>' +
    '</div>' +
    (state.tasks ? '<div class="list mono"><h3>임무 체크리스트 ' + taskDone() + ' / ' + state.tasks.length + '</h3>' +
      state.tasks.map((t, i) => '<div class="task' + (t.done ? ' on' : '') + '" data-t="' + i + '">' +
        '<b>' + (t.done ? '✓' : '□') + '</b><span>' + t.t + '</span></div>').join('') +
      (state.doneAt
        ? '<div class="cleared mono">임무 완수 — ' + swText(swMs()) + '<br><small>ARCHIVE 에 기록되었다.</small></div>'
        : '<div class="hint mono">' + (state.reelDone ? '영상 끝. 남은 항목을 확인하면 시계가 멈춘다.' : '작전을 보면서 하나씩 눌러 확인한다.') + '</div>') +
    '</div>' : '') +
    '<div class="meta mono">SHOT <b>' + (state.i+1) + '/' + sh.length + '</b> · DATE <b>' + m.key + '</b><br>' +
      'FLOOR <b>' + m.floor + '</b> · SECTOR <b>' + m.sector + '</b> · THREAT <b>' + m.threat.n + '</b><br>' +
      'SQUADS <b>' + m.squadA + ' / ' + m.squadB + '</b> · ARMS <b>' + m.weapon + '</b> · STRENGTH <b>' + m.soldiers + '</b></div>' +
  '</div>';
  document.getElementById('play').onclick = () => state.playing ? pause() : play();
  document.getElementById('prev').onclick = () => { pause(); go(state.i - 1); };
  document.getElementById('next').onclick = () => { pause(); go(state.i + 1); };
  document.getElementById('arch').onclick = archive;
  document.getElementById('full').onclick = () => { toggleFull(); setTimeout(render, 120); };
  document.getElementById('brief').onclick = () => { pause(); state.started = false; render(); };
  document.getElementById('mute').onclick = () => { toggleMute(); render(); };
  app.querySelectorAll('.task').forEach(el => el.onclick = () => checkTask(Number(el.dataset.t)));
}
function go(i) {
  const n = shots(state.mission).length;
  state.i = Math.max(0, Math.min(n - 1, i));
  state.cued = -1;
  if (state.i === n - 1) { state.reelDone = true; finishIfDone(); remember(); }
  render();
}
function play() {
  const sh = shots(state.mission);
  if (state.i >= sh.length - 1) { state.i = 0; state.cued = -1; }
  state.playing = true; render(); tick();
}
function tick() {
  clearTimeout(state.timer);
  const sh = shots(state.mission);
  state.timer = setTimeout(() => {
    if (!state.playing) return;
    if (state.i >= sh.length - 1) { state.playing = false; state.reelDone = true; finishIfDone(); render(); remember(); return; }
    state.i++; render(); tick();
  }, sh[state.i].ms);
}
function pause() { hush(); state.playing = false; clearTimeout(state.timer); render(); }

function loadLog() { try { return JSON.parse(localStorage.getItem(K_STORE)) || []; } catch (e) { return []; } }
function remember() {
  const m = state.mission, log = loadLog();
  const rec = {
    key: m.key + (state.mode === 'jr' ? '-JR' : ''), jr: state.mode === 'jr', fileNo: m.fileNo, threat: m.threat.n, floor: m.floor, result: m.outcome.t,
    ms: state.doneAt ? swMs() : 0,
    tasks: taskDone(), tasksAll: state.tasks ? state.tasks.length : 0,
    tries: state.attempt || 0,
    clear: !!state.doneAt
  };
  const at = log.findIndex(x => x.key === rec.key);
  // 같은 날은 한 줄만. 더 좋은 기록(완수 우선, 그 다음 빠른 시간)일 때만 덮어쓴다.
  if (at < 0) log.unshift(rec);
  else {
    const old = log[at];
    const better = (rec.clear && !old.clear) || (rec.clear && old.clear && rec.ms < old.ms) || (!old.clear && rec.tasks > old.tasks);
    if (better) log[at] = rec;
  }
  try { localStorage.setItem(K_STORE, JSON.stringify(log.slice(0, 60))); } catch (e) {}
}
function archive() {
  if (!unlocked()) return renderLock();
  pause();
  const log = loadLog();
  const cleared = log.filter(x => x.clear);
  const best = cleared.length ? cleared.reduce((a, b) => (a.ms && a.ms < b.ms ? a : b)) : null;
  const rows = log.length
    ? log.map(x => '<div style="padding:9px 0;border-bottom:1px solid #222c35">' +
        (x.clear ? '<span style="color:#ffdc4a">✓ </span>' : '<span style="color:#6f8598">· </span>') + x.key +
        (x.jr ? ' <span style="color:#eba93c">🌰 주니어</span>' : '') + ' · ' + x.fileNo +
        '<br><span style="color:#8aa0b4">FLOOR ' + x.floor + ' · ' + x.threat + ' · ' + x.result + '</span>' +
        '<br><span style="color:#5fd08a">⏱ ' + (x.ms ? swText(x.ms) : '--:--.-') + '</span>' +
        '<span style="color:#8aa0b4"> · ☑ ' + (x.tasks || 0) + '/' + (x.tasksAll || 5) + ' · 심사 ' + (x.tries || 1) + '회</span>' +
        (best && best === x ? '<span style="color:#ffdc4a"> · 최고 기록</span>' : '') +
      '</div>').join('')
    : '<p style="color:#8aa0b4">NO FILES ON RECORD. 임무를 완수하면 여기에 기록이 남는다.</p>';
  app.innerHTML = '<style>' + css() + '</style><div class="wrap">' +
    '<span class="badge mono">CLASSIFIED</span><h1 class="mono">ARCHIVE</h1>' +
    '<p class="sub mono">OPERATIONS ON RECORD: ' + log.length + ' · 완수 ' + cleared.length +
      (best ? ' · 최고 기록 ' + swText(best.ms) : '') + '</p>' +
    '<div class="meta mono">' + rows + '</div>' +
    '<div class="row"><button class="p tapbtn" id="back">◀ BACK TO FILE</button></div></div>';
  document.getElementById('back').onclick = () => render();
}

state.mission = buildMission(dayKey(new Date()));
document.addEventListener('fullscreenchange', () => render());
render();
</script>
</body>
