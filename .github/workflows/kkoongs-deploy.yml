name: Deploy Kkoongs to Firebase Hosting

on:
  push:
    branches:
      - family
    paths:
      - 'dalkkung-family-app/**'
      - '.github/workflows/kkoongs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kkoongs-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALMON_LOGS }}'
          projectId: salmon-logs
          channelId: live
          target: kkoongs
          entryPoint: './dalkkung-family-app'
          firebaseToolsVersion: '15.22.1'
