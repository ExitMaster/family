name: Deploy Kkoongs to Firebase

on:
  push:
    branches:
      - family
    paths:
      - 'dalkkung-family-app/**'
      - '.github/workflows/kkoongs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kkoongs-production
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: salmon-logs
  HOSTING_TARGET: kkoongs
  FIREBASE_TOOLS_VERSION: '15.22.1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dalkkung-family-app
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SALMON_LOGS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::GitHub Secret FIREBASE_SERVICE_ACCOUNT_SALMON_LOGS 가 비어 있습니다. dalkkung-family-app/DEPLOY.md 의 1~3단계를 먼저 끝내 주세요."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 - "$RUNNER_TEMP/firebase-service-account.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          missing = [k for k in ('type', 'project_id', 'client_email', 'private_key') if k not in data]
          if missing:
              sys.exit(f"::error::서비스 계정 JSON에 다음 키가 없습니다: {', '.join(missing)}")
          if data['project_id'] != 'salmon-logs':
              sys.exit(f"::error::서비스 계정의 project_id 가 salmon-logs 가 아니라 {data['project_id']} 입니다.")
          print(f"service account: {data['client_email']}")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-tools
        run: npm install -g "firebase-tools@$FIREBASE_TOOLS_VERSION"

      # Hosting 과 Firestore Rules 를 한 번에 배포한다.
      # 로컬 `npm run deploy` 와 같은 대상을 배포하므로 두 경로가 어긋나지 않는다.
      - name: Deploy Hosting and Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only "firestore:rules,hosting:$HOSTING_TARGET" \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
